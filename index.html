 off the area until it is watered in and dry. Every application is made under the CVCS DPR license — if anything looks wrong, STOP and call Michael at (209) 678-3079.","es":"SIEMPRE: guantes, protección para los ojos, pantalón largo, zapatos cerrados. Lávese las manos antes de comer o fumar. No deje que entre gente ni mascotas hasta que se riegue y seque. Toda aplicación se hace bajo la licencia DPR de CVCS — si algo se ve mal, PARE y llame a Michael al (209) 678-3079."},"cats":{"FERT":"Fertilizers — Horizon / TurfGro / BEST","PRE":"Pre-emergents — weed prevention","POST":"Post-emergents — weed killers","FUNG":"Fungicides","GREEN":"Quick green-up","WET":"Moisture / dry-spot rescue","TREE":"Tree care","SEED":"Seed — Horizon Central Valley","KNOCK":"Knockdown — non-selective","LIGHT":"Outdoor lighting — Kichler · FX Luminaire (SiteOne)"},"services":{"AER":{"name":"Core Aeration","unit":"per 1,000 sq ft","price":0,"es":"Aireación","desc":"Pull plugs to break compaction — air, water and fertilizer reach the roots","steps":{"en":["FLAG EVERY sprinkler head and valve box FIRST — one tine through a head ruins the day.","Soil should be moist, not soggy — water the day before if it's hard.","Two passes in different directions over the whole lawn.","Leave the plugs on the lawn — they melt back in within 2 weeks and feed the soil.","Best time to fertilize or overseed is RIGHT AFTER aerating — the holes are open doors.","Blow plugs off walks and patios only.","Pull the flags and count the heads back."],"es":["MARQUE TODOS los aspersores y cajas de válvulas PRIMERO — un diente sobre un aspersor arruina el día.","La tierra debe estar húmeda, no empapada — riegue un día antes si está dura.","Dos pasadas en diferentes direcciones por todo el césped.","Deje los tapones en el césped — se deshacen en 2 semanas y alimentan la tierra.","El mejor momento para fertilizar o resembrar es JUSTO DESPUÉS de airear — los hoyos son puertas abiertas.","Sople los tapones solo de las banquetas y patios.","Quite las banderas y cuente los aspersores de regreso."]}},"AERSEED":{"name":"Aeration + Overseed Package","unit":"per 1,000 sq ft","price":0,"es":"Aireación + Resiembra","desc":"Aerate, seed into the open holes, starter fert — the full renovation","steps":{"en":["Flag heads, aerate two directions (see Core Aeration steps).","Seed IMMEDIATELY after — the seed falls into the plug holes for perfect soil contact.","Use the seed and rate from the Seed library for the property.","Apply starter fertilizer the same visit.","Set the customer's timer: light water 2 to 3 times a day for 2 weeks.","No pre-emergent 8 weeks either side. Stay off 3 weeks.","Log seed bags and fert bags used."],"es":["Marque aspersores, airee en dos direcciones (vea los pasos de Aireación).","Siembre INMEDIATAMENTE después — la semilla cae en los hoyos para contacto perfecto con la tierra.","Use la semilla y dosis de la biblioteca de Semilla para la propiedad.","Aplique fertilizante de arranque en la misma visita.","Programe el timer del cliente: riego ligero 2 a 3 veces al día por 2 semanas.","Sin pre-emergente 8 semanas antes o después. No pisar por 3 semanas.","Apunte las bolsas de semilla y fertilizante usadas."]}},"OSEED":{"name":"Overseed Only","unit":"per 1,000 sq ft","price":0,"es":"Resiembra","desc":"Thicken a thin lawn — scalp, seed, rake, water program","steps":{"en":["Follow the seed variety's steps in the Seed library — mow short, seed, rake in, water light and often."],"es":["Siga los pasos de la variedad de semilla en la biblioteca — corte bajito, siembre, rastrille, riegue poco y seguido."]}},"GUTTER":{"name":"Gutter Cleaning","unit":"per job","price":0,"es":"Limpieza de Canaletas","desc":"Clear gutters and downspouts, bag debris, flush test","steps":{"en":["TWO people minimum — one on the ladder, one footing it. Ladder on flat solid ground, never on the gutter itself.","Scoop all debris into a bucket or bag — never onto the lawn or beds below.","Flush each gutter run with the hose toward the downspout.","Check every downspout flows free — snake or blast any clog from the BOTTOM up.","Haul debris away; leave the roofline, walks and beds clean.","Photo before and after for the customer."],"es":["MÍNIMO DOS personas — una en la escalera, otra deteniéndola. Escalera en piso plano y firme, nunca sobre la canaleta.","Saque toda la basura a una cubeta o bolsa — nunca al césped o jardineras de abajo.","Enjuague cada canaleta con la manguera hacia el bajante.","Revise que cada bajante fluya libre — destape cualquier tapón desde ABAJO hacia arriba.","Llévese la basura; deje el techo, banquetas y jardineras limpios.","Foto de antes y después para el cliente."]}},"TPRUNE":{"name":"Tree Pruning","unit":"per tree","price":0,"es":"Poda de Árbol","desc":"Structural pruning, deadwood removal, canopy raise — clean cuts, no topping","steps":{"en":["Walk the tree with Michael's bid photos — prune what was SOLD, nothing more.","Never remove more than 25% of the live canopy in one season.","Cut just OUTSIDE the branch collar — never flush, never leave stubs.","NO TOPPING. Ever. Reduction cuts go back to a lateral at least 1/3 the size.","Deadwood first, then crossing/rubbing branches, then the canopy raise or thinning.","Power lines within 10 feet = STOP and call Michael. That's not our cut.","Haul all brush, rake fine debris, blow the site clean.","After photos from the same angles as the bid photos."],"es":["Camine el árbol con las fotos de la cotización de Michael — pode lo que se VENDIÓ, nada más.","Nunca quite más del 25% de la copa viva en una temporada.","Corte justo AFUERA del collar de la rama — nunca al ras, nunca deje muñones.","NO DESMOCHE. Nunca. Los cortes de reducción van a una lateral de al menos 1/3 del grosor.","Primero madera muerta, luego ramas cruzadas, luego levantar o aclarar la copa.","Cables de luz a menos de 10 pies = PARE y llame a Michael. Ese corte no es nuestro.","Llévese toda la rama, rastrille lo fino, sople el sitio limpio.","Fotos de después desde los mismos ángulos que las fotos de la cotización."]}},"TCHEM":{"name":"Tree Chemical Treatment (aphids/scale)","unit":"per tree","price":0,"es":"Tratamiento Químico de Árbol","desc":"Systemic soil drench — season-long aphid and scale control","steps":{"en":["Follow the 'Tree aphid systemic' steps in the product library — soil moist first, ring at the dripline, never during bloom, log the tree."],"es":["Siga los pasos de 'sistémico para pulgón' en la biblioteca de productos — tierra húmeda primero, círculo en la orilla de la copa, nunca en floración, apunte el árbol."]}},"ABATE":{"name":"Weed Abatement (fire compliance)","unit":"per acre","price":0,"es":"Desyerbe (Cumplimiento de Incendios)","desc":"Discing or mowing vacant lots and field edges to county fire code before the deadline","steps":{"en":["Know the county deadline — abatement notices usually want lots cleared by late May / June 1. Late = county does it and bills the owner triple.","Walk the lot FIRST: mark rocks, stumps, pipes, wells, and trash that will eat a disc or throw from a mower.","Fire rules of thumb: vegetation down to 3–4 inches; a disced or cleared firebreak strip along roads and structures per the notice.","NO metal blades against rocks on dry grass after 10 AM — one spark starts the fire we're preventing. Morning work, watch red-flag days.","Water truck or extinguisher ON SITE for dry-season mowing. No exceptions.","Disc perimeter first, then work the interior in passes.","Photos before and after every side of the lot — that's the compliance proof the county wants.","Haul dumped trash separately — it's chargeable, photograph it before touching."],"es":["Sepa la fecha límite del condado — normalmente los lotes deben estar limpios para fines de mayo / 1 de junio. Tarde = el condado lo hace y cobra triple.","Camine el lote PRIMERO: marque piedras, troncos, tubos, pozos y basura que arruinan un disco o salen volando del desbrozador.","Reglas de fuego: vegetación a 3–4 pulgadas; franja cortafuego disqueada a lo largo de caminos y estructuras según el aviso.","NO metal contra piedras en pasto seco después de las 10 AM — una chispa empieza el fuego que estamos previniendo. Trabajo de mañana, cuidado con días de bandera roja.","Pipa de agua o extintor EN EL SITIO para desbrozar en temporada seca. Sin excepciones.","Primero el perímetro con disco, luego el interior en pasadas.","Fotos de antes y después por cada lado del lote — esa es la prueba de cumplimiento que quiere el condado.","La basura tirada se lleva aparte — se cobra, fotografíela antes de tocarla."]}}},"diagnose":[{"cat":"Lawn diseases","items":[{"name":"Brown Patch","sev":"MED","products":["FUNGG"],"looks":"Circular brown patches from 6 inches to 3 feet across. In morning dew you can see a darker 'smoke ring' edge. Grass in the patch pulls up easy but roots are still attached.","cause":"Warm nights + wet leaf blades overnight. Almost always night watering plus summer humidity. Too much nitrogen makes it worse.","fix":"Apply Headway G over the patch plus a 5–10 ft ring of healthy grass. Move ALL watering to early morning. Skip the next nitrogen feed on this lawn.","prevent":"Water 4–8 AM only, never evenings. Don't push heavy nitrogen in July–August heat."},{"name":"Dollar Spot","sev":"LOW","products":["FUNGG"],"looks":"Straw-colored spots the size of silver dollars, sometimes merging. Blades show hourglass-shaped tan lesions with reddish edges. Cobweb fuzz in early morning dew.","cause":"Hungry lawn — low nitrogen — plus heavy dew sitting on the leaf.","fix":"Light nitrogen feed usually clears it. Fungicide only if it keeps spreading after feeding.","prevent":"Stay on the fertilizing program; water early morning so the leaf dries fast."},{"name":"Summer Patch","sev":"HIGH","products":["FUNGG"],"looks":"Irregular straw patches and rings that show up in the worst heat, often along concrete where soil is hottest. Roots are dark and rotted — grass pulls up with NO roots.","cause":"Root-attacking fungus that builds all spring and shows in July–August heat. Compacted, shallow-watered lawns get it worst.","fix":"Fungicide slows it but won't bring back dead roots. Aerate, water deep and less often, reseed dead areas in fall. Flag it to Michael — this one changes the care plan.","prevent":"Aerate yearly, deep infrequent watering, fungicide in late spring on lawns with history."},{"name":"Rust","sev":"LOW","products":["AMS","SG"],"looks":"Orange-yellow powder that coats shoes, mowers, and dogs. Lawn looks thin and orange-tinted from a distance.","cause":"Slow-growing, underfed grass in late summer/fall. The grass isn't outgrowing the fungus.","fix":"Feed it — quick nitrogen wakes it up and it mows out in 2–3 weeks. No fungicide needed.","prevent":"Keep the lawn on its feeding schedule going into fall."},{"name":"Fairy Ring","sev":"LOW","products":[],"looks":"Dark green circles or arcs, sometimes with mushrooms after watering or rain. Grass inside the ring can thin out.","cause":"Old buried wood or roots breaking down underground.","fix":"Aerate through the ring, water deep, feed the lawn so the color evens out. Knock mushrooms over with the mower.","prevent":"Mostly cosmetic — manage it, don't fight it."}]},{"cat":"Lawn pests","items":[{"name":"White Grubs","sev":"HIGH","products":[],"looks":"Turf feels spongy and peels back like carpet — no roots underneath. Birds, skunks and raccoons digging at night. Fat white C-shaped grubs in the top 2 inches of soil. More than 5 per square foot = treat.","cause":"Beetle larvae eating the roots, worst late summer into fall.","fix":"Grub insecticide watered in half an inch the SAME day. Tell Michael which product we're stocking — then reseed the dead areas in fall.","prevent":"Preventive grub control in early summer on lawns with history."},{"name":"Sod Webworm","sev":"MED","products":[],"looks":"Ragged chewed-off patches that grow nightly. Small tan moths zigzag up ahead of the mower at dusk. Green pellet droppings in the thatch.","cause":"Caterpillars living in thatch tubes, feeding at night.","fix":"Soap flush to confirm (2 Tbsp dish soap in 2 gal water over 1 sq yd — worms surface in 10 minutes). Insecticide late afternoon, no water for 24 hours after.","prevent":"Dethatch heavy lawns; healthy watered turf outgrows light feeding."},{"name":"Armyworms","sev":"HIGH","products":[],"looks":"Brown areas that spread FAST — days, not weeks. Striped caterpillars visible on blades early morning, moving in groups like a front line.","cause":"Moth flights lay eggs in waves, usually late summer.","fix":"Treat the SAME DAY you find them — they can take a lawn in a weekend. Insecticide over the whole lawn, then call Michael to check neighboring accounts.","prevent":"Watch flagged neighborhoods hard in August–September."}]},{"cat":"Tree pests","items":[{"name":"Aphids","sev":"MED","products":["APHID"],"looks":"Sticky 'sap' dripping on cars and sidewalks under the tree — that's honeydew. Curled, twisted new leaves. Ant highways up the trunk (ants farm the aphids). Black sooty coating follows.","cause":"Soft-bodied suckers on new growth, exploding in spring.","fix":"Systemic soil drench (see the tree product steps) — season-long control. Hose-blast small trees. Sticky-band the trunk to break the ant highway.","prevent":"Spring drench after bloom on trees with history — never during bloom (bees)."},{"name":"Scale","sev":"MED","products":["APHID"],"looks":"Little bumps stuck on twigs and branches that don't scrape off clean — brown, white or cottony. Honeydew and sooty mold like aphids, but no visible bugs moving.","cause":"Armored suckers that look like bark bumps, not insects.","fix":"Systemic drench gets the crawlers. Dormant oil spray in winter smothers the shells. Heavy branches — prune out and haul off.","prevent":"Winter dormant oil on trees with history."},{"name":"Spider Mites","sev":"LOW","products":[],"looks":"Leaves look dusty, stippled, bronze. Fine webbing on the underside and branch tips. Shake a branch over white paper — moving dots.","cause":"Hot, dusty, drought-stressed sites — worst along gravel and roads.","fix":"Hard hose-blasts up under the leaves 2–3 times a week — water is the best weapon. Horticultural oil if severe. Do NOT hit them with broad insecticide — it kills their predators and makes it worse.","prevent":"Keep trees watered; rinse dusty foliage on gravel sites."},{"name":"Borers / Bark Beetles","sev":"HIGH","products":[],"looks":"Small round or D-shaped exit holes in bark, sawdust (frass) in crevices or at the base, sap globs, branches dying from the top down.","cause":"They attack STRESSED trees — drought, damage, bad pruning cuts.","fix":"STOP and call Michael with photos. Water deep, remove badly infested limbs. There's no spray that fixes a bored-out tree — this is a keep-or-remove decision.","prevent":"Deep-water valley trees through summer; no trunk damage from trimmers and mowers."}]},{"cat":"Tree diseases","items":[{"name":"Anthracnose","sev":"LOW","products":[],"looks":"Brown/black blotches along the leaf veins in spring, curled young leaves dropping early, twig dieback. Sycamores and ash get it every wet spring in the Valley.","cause":"Fungus in cool wet spring weather. Ugly but rarely serious.","fix":"Rake up and haul off fallen leaves (they hold the spores). Prune for airflow. Tree pushes a clean second set of leaves when it warms.","prevent":"Fall cleanup under trees with history."},{"name":"Fire Blight","sev":"HIGH","products":[],"looks":"Shoots look torched — black, dead, tip curled over like a shepherd's crook. Ornamental pears everywhere in the Valley get it in spring.","cause":"Bacteria spread in bloom by bees and splashing rain.","fix":"Prune 10–12 inches BELOW the visible black, dipping the cutters in disinfectant between EVERY cut. Haul the wood off site. Flag to Michael — bad cases need a plan.","prevent":"No heavy nitrogen on pears (soft growth invites it)."},{"name":"Powdery Mildew","sev":"LOW","products":[],"looks":"White flour dusted on leaves and buds — crape myrtles and roses mostly.","cause":"Shade + crowded still air. Unlike most fungus, it likes it DRY.","fix":"Prune to open airflow. Odd but true: hosing the leaves washes spores off. Fungicide only for repeat offenders.","prevent":"Plant/prune for sun and air movement."},{"name":"Sooty Mold","sev":"LOW","products":["APHID"],"looks":"Black soot coating leaves, twigs, everything under the tree.","cause":"It's NOT the disease — it grows on honeydew from aphids or scale ABOVE. Find the bug.","fix":"Treat the insect (systemic drench). The mold weathers off on its own once the honeydew stops.","prevent":"Stay ahead of aphids and scale."},{"name":"Root Rot (overwatering)","sev":"HIGH","products":[],"looks":"Tree declining for no visible reason — small pale leaves, thin canopy, dieback. Soil stays wet at the base. Dark, wet, sour-smelling bark at the crown.","cause":"Water sitting at the root crown — usually lawn irrigation hitting the trunk daily.","fix":"Pull soil and mulch back from the trunk flare, redirect sprinklers off the trunk, cut watering frequency. Flag to Michael — often an irrigation redesign call.","prevent":"Trees want DEEP and RARE water, not daily lawn spray on the trunk."}]},{"cat":"Weeds in the grass","items":[{"name":"Crabgrass","sev":"MED","products":["DIM","PROD","DRIVE"],"looks":"Wide-bladed light-green clumps growing flat like a star, exploding in summer heat along edges and thin spots.","cause":"Seeds sprout when soil warms in spring — thin turf lets it in.","fix":"Too late once it's up big — pre-emergent stops NEXT year's crop (February Dimension does this job). Thicken the lawn in fall.","prevent":"February pre-emergent every year + a thick mowed-high lawn."},{"name":"Spurge","sev":"MED","products":["SPEED","PROD"],"looks":"Flat mat hugging the ground, tiny leaves, red stems that bleed milky sap when broken. Loves hot concrete edges and cracks.","cause":"Summer heat germinator — the McDonald's crack weed.","fix":"SpeedZone on actively growing spurge; hand-pull mats before they seed (one plant = thousands of seeds).","prevent":"Summer pre-emergent (August Prodiamine) + healthy edges."},{"name":"Nutsedge","sev":"MED","products":["SEDGE"],"looks":"Looks like grass but grows twice as fast, lighter yellow-green, triangular stem you can feel by rolling it in your fingers. V-shaped blades in threes.","cause":"Wet spots — overwatering or poor drainage. It maps your irrigation leaks for you.","fix":"Regular weed killer does NOTHING. Needs a sedge-specific product (halosulfuron — tell Michael to stock it). Fix the wet spot or it returns.","prevent":"Fix drainage and watering — sedge follows water."},{"name":"Clover / Oxalis","sev":"LOW","products":["SPEED"],"looks":"Clover: round three-leaf patches with white flowers. Oxalis: looks like clover but yellow flowers and heart-shaped leaves.","cause":"Low-nitrogen lawns — clover makes its own fertilizer and outcompetes hungry grass.","fix":"SpeedZone knocks both down. Then feed the lawn — a fed lawn crowds them out.","prevent":"Stay on the nitrogen program."},{"name":"Dandelion / Broadleaf","sev":"LOW","products":["SPEED"],"looks":"The classics — dandelion rosettes, plantain, mallow. Anything wide-leafed that isn't grass.","cause":"Blow-ins finding thin spots.","fix":"SpeedZone spot-spray while they're growing. Pull the taproot on singles.","prevent":"Thick turf is the real herbicide."}]}],"trees":[{"name":"Modesto Ash","prune":"Winter (Dec–Feb, dormant)","notes":"THE classic Valley street tree and the most brittle. Weak branch unions split in wind — structural pruning every 3–5 years is not optional. Never top it; topping made half the ash failures in town.","watch":"Anthracnose every wet spring (cosmetic). Mistletoe clumps — cut the branch 12 in below. Borers on drought-stressed trees.","treat":"Rake spring leaf drop for anthracnose. Deep water monthly in summer — a watered ash doesn't get borers."},{"name":"Fruitless Mulberry","prune":"Winter only (Dec–Jan) for pollarding","notes":"The Valley shade machine — grows 6+ ft a year. If it's been pollarded (knuckle-cut) before, it MUST be cut back to the same knuckles every 1–2 winters — always to the knuckle, never between. If it's natural, keep it natural.","watch":"Sooty mold from scale. Fast regrowth shading lawns to death underneath. Surface roots lifting concrete.","treat":"Systemic drench for scale. Bid pollarding by the knuckle count — it's predictable money every winter."},{"name":"Ornamental Pear (Bradford)","prune":"Late winter — but see fire blight rule","notes":"In every shopping center and McDonald's lot in the Valley. Narrow branch angles split with age — thin and subordinate competing leaders young.","watch":"FIRE BLIGHT — torched black shepherd's-crook shoots in spring (HIGH — see Diagnose). Splits in summer wind.","treat":"Blight: cut 10–12 in below the black, dip tools between EVERY cut, haul wood off. Never prune these in bloom."},{"name":"Crape Myrtle","prune":"Late winter (Feb) — light only","notes":"Blooms on NEW wood. Pencil-prune: remove suckers, crossing twigs, old seed heads. 'Crape murder' (hacking to stubs) ruins structure and invites problems — CVCS doesn't do it.","watch":"Powdery mildew on older varieties in shade. Aphids dripping honeydew on cars parked below.","treat":"Aphid drench in spring after bloom starts is too late for bees — drench pre-bloom or use insecticidal soap. Mildew: prune for air."},{"name":"London Plane / Sycamore","prune":"Winter dormant","notes":"Big parking-lot and park tree. Takes heavy pruning and pollarding. Massive leaf drop = fall cleanup revenue.","watch":"Anthracnose every cool wet spring — first leaves brown and drop, looks dead, isn't. Fuzz on new leaves irritates crew lungs.","treat":"Second flush of leaves comes when it warms — tell worried customers to wait. Rake and haul infected leaves."},{"name":"Chinese Pistache","prune":"Winter — structure when young","notes":"Best fall color in the Valley, nearly bulletproof once established. Young trees are gawky — stake straight and structural-prune the first 5 years, then leave it alone.","watch":"Almost nothing. Verticillium wilt (one side dies) on bad soil — rare.","treat":"Wilt: no cure — water deep, feed, call Michael on removal timing."},{"name":"Valley Oak / Coast Live Oak","prune":"July–September ONLY (dry season)","notes":"Native oaks are protected in many jurisdictions — check before major work. NEVER summer-water an established native oak's root crown; lawn irrigation kills more Valley oaks than anything else.","watch":"Crown rot from lawn water at the trunk (HIGH). Mistletoe. Oak worms some years — noisy but survivable.","treat":"Pull irrigation off the root zone, mulch wide, prune only in dry months to dodge disease vectors."},{"name":"Liquidambar (Sweetgum)","prune":"Winter","notes":"Great color, terrible spiky balls — the #1 slip complaint on commercial walks. Surface roots lift sidewalks.","watch":"Spiky ball drop Oct–Jan (bid extra cleanups). Root/hardscape conflicts. Chlorosis (yellow leaves, green veins) on alkaline Valley soil.","treat":"Chlorosis: chelated iron soil treatment spring. Ball cleanup goes in the maintenance bid, not free labor."},{"name":"Chinese Elm","prune":"Late winter; clean deadwood anytime","notes":"Tough evergreen-ish shade tree, beautiful puzzle bark. Fast grower — canopy raise every couple years over drives and walks.","watch":"Elm leaf beetle skeletonizing leaves some summers. Aphid honeydew.","treat":"Systemic drench covers both beetle and aphid in one spring shot."},{"name":"Mexican Fan Palm / Queen Palm","prune":"June–August (after seed stalks emerge)","notes":"Skinning and seed-pod removal is per-palm bid money. NEVER over-trim — hurricane-cutting (past 9-and-3) starves the palm and invites weevils. Green fronds stay.","watch":"Dead frond skirts = fire + rat condos (HIGH on commercial). Nutrient deficiency: yellow banding on Queens.","treat":"Annual skinning bid per palm. Queens: palm-special fertilizer with Mg/Mn — flag Michael to stock it."},{"name":"Deodar Cedar / Redwood","prune":"Minimal — deadwood only, any season","notes":"Big conifers hate hard pruning — never top, never lion-tail. Redwoods in the Valley run chronically thirsty; browning interior needles in drought years is triage, not disease.","watch":"Redwood: drought browning (starts inside-out = normal shed; tips-in = stress). Cedar: flagging branchlets in heat. Bark beetles on drought-stressed pines nearby (HIGH).","treat":"Deep soak monthly all summer — a soaker ring at the dripline sells itself after one brown summer."},{"name":"Purple Leaf Plum","prune":"After bloom (spring) or summer","notes":"Short-lived (20–25 yrs) ornamental. Water sprouts everywhere — thin them yearly or the canopy turns to broom.","watch":"Aphids curl the new purple leaves every single spring. Borers as it ages — start planning replacement at year 20.","treat":"Pre-season systemic drench = clean leaves all year. Shot-hole fungus: rake leaves, don't overhead-water."},{"name":"Olive (fruitless)","prune":"Summer (June–Aug)","notes":"Made for the Valley — same climate as Spain. Thin for the open Mediterranean look; it takes hard pruning without complaint.","watch":"'Fruitless' varieties still throw some fruit — staining bid on patios. Scale. Sucker thickets at the base.","treat":"Growth-regulator fruit spray in bloom for true no-fruit (licensed app — PUR reportable). Suckers: cut, don't spray."},{"name":"Ginkgo","prune":"Winter, minimal","notes":"Living fossil, zero pests, perfect gold fall color that drops ALL AT ONCE — one big cleanup, not six.","watch":"Basically nothing. Slow first 5 years — tell impatient customers it's normal.","treat":"Stake straight when young. Done."},{"name":"Magnolia (Southern)","prune":"After spring bloom, light","notes":"Evergreen with year-round leaf drop — the leathery leaves don't mulch-mow, they mat. Lower limbs sweep the ground naturally; raising them is a look decision, ask the client.","watch":"Chlorosis on alkaline soil. Scale on stressed trees. Constant leaf litter in beds.","treat":"Chelated iron for yellowing. Leaf cleanup belongs in the monthly rate."},{"name":"Citrus (residential)","prune":"March–April after frost risk","notes":"Every third Valley backyard. Prune light after harvest — citrus fruits on outer canopy, hard cuts cost the crop. Paint exposed bark white (sunburn is real).","watch":"Leafminer squiggles (cosmetic). Scale + ants. Yellow leaves = iron or overwatering. HLB quarantine rules on moving citrus wood in parts of the Valley — chip on site.","treat":"Ant control + horticultural oil beats scale. Don't haul citrus brush across quarantine lines — check the county map."}]};

async function loadStore(){
  let v=null;
  if(window.storage&&window.storage.get){ try{const r=await window.storage.get(KEY); if(r) v=r.value;}catch(e){} }
  if(v===null){ try{v=localStorage.getItem(KEY);}catch(e){} }
  try{S=v?JSON.parse(v):null;}catch(e){S=null;}
  if(!S) S={baselines:{},logs:{},purchases:[],assignments:{},custom:[],edits:{},prodEdits:{},prodCustom:[],docs:[],monthMods:{},bids:[],svcEdits:{},programs:{},acctNotes:{},customProgs:{},svcCustom:{},lighting:{},aerseed:{},abateMeta:{},diagCustom:[],treeCustom:[],labor:{},rate:75};
  S.baselines=S.baselines||{}; S.logs=S.logs||{}; S.purchases=S.purchases||[]; S.assignments=S.assignments||{}; S.custom=S.custom||[]; S.edits=S.edits||{}; S.prodEdits=S.prodEdits||{}; S.prodCustom=S.prodCustom||[]; S.docs=S.docs||[]; S.monthMods=S.monthMods||{}; S.bids=S.bids||[]; S.svcEdits=S.svcEdits||{}; S.programs=S.programs||{}; S.acctNotes=S.acctNotes||{}; S.customProgs=S.customProgs||{}; S.svcCustom=S.svcCustom||{}; S.lighting=S.lighting||{}; S.aerseed=S.aerseed||{}; S.abateMeta=S.abateMeta||{}; S.diagCustom=S.diagCustom||[]; S.treeCustom=S.treeCustom||[]; S.labor=S.labor||{}; if(!S.rate)S.rate=75;
}
async function save(){
  const s=JSON.stringify(S); let ok=false;
  try{localStorage.setItem(KEY,s); ok=true;}catch(e){}
  if(window.storage&&window.storage.set){ try{await window.storage.set(KEY,s); ok=true;}catch(e){} }
  saveState=ok?"saved":"err";
  render();
  setTimeout(()=>{saveState="";render();},1400);
}

/* ═══════════ MODEL ═══════════ */
const TIERS=["MCD","A","B","C","D","GOLF"];
const TIERDESC={MCD:"Restaurant — grass 2x · shrubs 3x · trees 2x",A:"Standard — grass 3x · shrubs 2x · trees 2x",
  B:"Enhanced — grass 4x · shrubs 4x · trees 2x",C:"Turf only — grass 3x",
  D:"Premium — grass bi-monthly · shrubs 4x · trees 2x",GOLF:"Ornamental only — shrubs 4x · trees 2x"};
const WDAYS=["Monday","Tuesday","Wednesday","Thursday","Friday"];

function ACC(){
  const list=DATA.accounts.concat(S.custom||[]);
  return list.map(a=>{
    const e=(S.edits||{})[a.id];
    return e?Object.assign({},a,e):a;
  }).filter(a=>!a.removed);
}
function findAcc(id){return ACC().find(a=>a.id===id);}

function working(id){
  const a=findAcc(id); if(!a) return {lawn:0,bed:0};
  return {lawn:(S.baselines[id]&&S.baselines[id].lawn!==undefined)?S.baselines[id].lawn:a.lawn,
          bed:(S.baselines[id]&&S.baselines[id].bed!==undefined)?S.baselines[id].bed:a.bed};
}
function planFor(m){
  const rows=[];
  const key=year+"-"+m, mods=S.monthMods[key]||{};
  for(const a of ACC()){
    let g=a.lawn>0?(DATA.grassCal[a.tier]||{})[m]:null;
    let b=a.bed>0?(DATA.bedCal[a.tier]||{})[m]:null;
    const t=a.trees?DATA.treeCal[m]:null;
    const mod=mods[a.id];
    if(mod){ if(g&&mod.lawn) g=mod.lawn; if(b&&mod.bed) b=mod.bed; }
    const x=(mod&&mod.extras)?mod.extras:[];
    if(g||b||t||x.length) rows.push({a,g,b,t,x});
  }
  rows.sort((x,y)=>RO[x.a.route]-RO[y.a.route]||DO[x.a.day]-DO[y.a.day]||x.a.id.localeCompare(y.a.id));
  return rows;
}

function status(row){
  const parts=[]; if(row.g)parts.push("lawn"); if(row.b)parts.push("bed");
  if(row.x) row.x.forEach((_,i)=>parts.push("x"+i));
  if(row.t)parts.push("tree");
  const done=parts.filter(k=>S.logs[lk(row.a.id,k)]&&S.logs[lk(row.a.id,k)].done);
  return {parts,done,complete:parts.length>0&&done.length===parts.length};
}
function monthTotals(m){
  const t={};
  const key=year+"-"+m, mods=S.monthMods[key]||{};
  for(const a of ACC()){
    const w=working(a.id);
    let g=a.lawn>0?(DATA.grassCal[a.tier]||{})[m]:null;
    let b=a.bed>0?(DATA.bedCal[a.tier]||{})[m]:null;
    const mod=mods[a.id];
    if(mod){ if(g&&mod.lawn) g=mod.lawn; if(b&&mod.bed) b=mod.bed; }
    if(g){const log=S.logs[key+"-"+a.id+"-lawn"]; t[g]=(t[g]||0)+(log&&log.done?log.actual:w.lawn);}
    if(b){const log=S.logs[key+"-"+a.id+"-bed"]; t[b]=(t[b]||0)+(log&&log.done?log.actual:w.bed);}
    if(mod&&mod.extras) mod.extras.forEach((x,i)=>{
      const log=S.logs[key+"-"+a.id+"-x"+i];
      t[x.code]=(t[x.code]||0)+(log&&log.done?log.actual:x.qty);
    });
  }
  const asp=S.aerseed[year];
  if(asp) asp.ids.forEach(id=>{
    const c=asp.cfg[id]; if(!c||c.month!==m) return;
    const log=S.logs[year+"-"+m+"-"+id+"-seed"];
    t[c.seed]=(t[c.seed]||0)+(log&&log.done?log.actual:c.bags);
  });
  return t;
}
function orderRows(m){
  const tot=monthTotals(m);
  return Object.entries(tot).map(([code,bags])=>{
    const p=P(code);
    const units=JUG[code]?Math.ceil(bags*JUG[code]-1e-9):Math.ceil(bags-1e-9);
    const purchased=S.purchases.filter(x=>x.code===code&&x.month===m&&x.year===year).reduce((s,x)=>s+x.qty,0);
    return {code,name:p.name,unit:p.unit,price:p.price,bags,units,cost:units*p.price,purchased};
  }).sort((a,b)=>b.cost-a.cost);
}

async function saveAccount(){
  const name=val("f_name").trim();
  if(!name){alert("Give the account a name.");return;}
  const rec={name:name, addr:val("f_addr").trim(), route:val("f_route"), day:val("f_day"),
             tier:val("f_tier"), lawn:parseFloat(val("f_lawn"))||0, bed:parseFloat(val("f_bed"))||0,
             trees:chk("f_trees")};
  if(editing.isNew){
    rec.id="X-"+Date.now();
    S.custom.push(rec);
  }else{
    const isBuiltIn=DATA.accounts.some(a=>a.id===editing.id);
    if(isBuiltIn){ S.edits[editing.id]=Object.assign({},S.edits[editing.id]||{},rec); }
    else{ const i=S.custom.findIndex(a=>a.id===editing.id); if(i>=0) S.custom[i]=Object.assign({},S.custom[i],rec); }
    // clear learned overrides so the new numbers take effect
    if(S.baselines[editing.id]) delete S.baselines[editing.id];
  }
  editing=null; await save();
}
async function deleteAccount(id){
  const isBuiltIn=DATA.accounts.some(a=>a.id===id);
  if(isBuiltIn){ S.edits[id]=Object.assign({},S.edits[id]||{},{removed:true}); }
  else{ S.custom=S.custom.filter(a=>a.id!==id); }
  delete S.baselines[id];
  Object.keys(S.assignments).forEach(k=>{
    const g=S.assignments[k];
    if(g&&g.ids){ g.ids=g.ids.filter(x=>x!==id); if(g.days) delete g.days[id]; }

  editing=null; confirmDel=false; await save();
}

function productsPDF(){
  const p=PROD(); const codes=Object.keys(p);
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"pt",format:"letter"});
  pdfHeader(doc,"PRODUCT LIBRARY","Rates, coverage and current pricing · "+new Date().toLocaleDateString());
  doc.autoTable({
    startY:64,margin:{left:28,right:28,bottom:50},
    head:[["PRODUCT","CATEGORY","USE","RATE / 1,000","UNIT","PRICE","COST / 1,000","COVERAGE"]],
    body:Object.keys(p).map(c=>{const x=p[c];return[
      x.name,DATA.cats[x.cat||"FERT"],x.use||"—",x.rate?x.rate+" "+x.rateUnit:"—",x.unit,
      x.price?"$"+x.price.toFixed(2):"TBD",
      costPer1k(x)?"$"+costPer1k(x).toFixed(2):"—",
      coverage(x)?coverage(x).toLocaleString()+" sq ft":"—"];}),
    styles:{fontSize:8,cellPadding:4},
    headStyles:{fillColor:NAVY,fontSize:7,fontStyle:"bold"},
    alternateRowStyles:{fillColor:[242,241,236]},
    columnStyles:{0:{fontStyle:"bold"},5:{halign:"right"},6:{halign:"right",fontStyle:"bold",textColor:ORANGE},7:{halign:"right"}}
  });
  pdfFooter(doc);
  doc.save("CVCS_Product_Library.pdf");
  archive("products","Product library",{stops:Object.keys(p).length,cost:0},{});
}

const RTCOLOR={A:"#E86010",B:"#202938",C:"#B3402A",D:"#6B7280"};

      h+='<p class="note">Photos save on this iPad and print on both PDFs. The proposal is client-clean — CVCS branding, no internal numbers.</p>';

             '<input class="fi" value="'+esc(L.notes||"")+'" placeholder="photocell on north wall, run 2 dim at far end…" oninput="lset(\''+a.id+'\',\'notes\',this.value)">';

             (confirmDel&&openLight===a.id?'<button class="btn red" onclick="rmLighting(\''+a.id+'\')">Confirm remove</button>'

  /* ── AERATE + SEED ── */
  if(tab==="aerseed"){

        h+='<div class="biditem" style="align-items:center">'+
          rchip(a.route)+

          '<span class="rsub">'+esc(a.addr)+'</span></div>'+

          '<select class="fi" style="padding:8px" onchange="asSet(\''+id+'\',\'seed\',this.value)">'+

          '<div><label class="fl" style="margin:0 0 3px">Bags</label>'+
          '<input class="fi" style="width:70px;padding:8px" type="number" min="0.5" step="0.5" value="'+c.bags+'" onchange="asSet(\''+id+'\',\'bags\',this.value)"></div>'+
          '<div><label class="fl" style="margin:0 0 3px">Month</label>'+
          '<select class="fi" style="padding:8px" onchange="asSet(\''+id+'\',\'month\',this.value)">'+
          ["September","October","November","March","April"].map(m=>'<option'+(m===c.month?" selected":"")+'>'+m+'</option>').join("")+'</select></div>'+
          '<label class="fchk" style="margin:0"><input type="checkbox" '+(c.aer?"checked":"")+' onchange="asSet(\''+id+'\',\'aer\',this.checked)"> Aerate</label>'+
          '<span class="chip '+(st.complete?"done":"bed")+'">'+st.done+'/'+st.total+'</span>'+
          '<button class="editbtn" style="background:#F6E3E0;color:var(--red)" onclick="asToggle(\''+id+'\')">✕</button>'+
          '</div>';
      }
    }
    h+='<div class="secrow" style="margin-top:14px"><span class="sechead">Enroll properties</span>'+
       '<button class="btn ghost" style="padding:7px 11px;font-size:11px" onclick="openProd(null,\'SEED\',\'lawn\')">+ New seed variety</button></div>';
    h+='<div class="toolrow"><input class="search" placeholder="Search accounts…" value="'+esc(asSearch)+'" oninput="asSearch=this.value;render()"></div>';

      '<span class="bchip-rt">'+a.route+'</span>🌱 '+esc(a.name)+'</button>';});
    h+='</div>';
    h+='<p class="note">Enrolled work shows up on the <b>Schedule</b> tab in its month right next to fertilizing — log aeration and seed there like everything else, and actual bag usage teaches the seed order just like fert.</p>';
  }

  /* ── LOT ABATEMENT ── */
  if(tab==="abate"){
    progSel="ABATEP";
    const p=progData(), rate=SVC().ABATE.price||0;
    S.abateMeta[year]=S.abateMeta[year]||{};
    const meta=S.abateMeta[year];
    let rev=0; p.ids.forEach(id=>{rev+=((meta[id]||{}).acres||0)*(((meta[id]||{}).rate)||rate);});
    const doneCt=p.ids.filter(id=>progDone(id).complete).length;
    h+='<div class="panel"><div class="rmain"><div class="ptitle">Lot Abatement — '+year+'</div>'+
       '<div class="psub">Discing / mechanical weeding · county deadline June 1 · '+p.ids.length+' lots · '+doneCt+' complete · $'+rev.toLocaleString(undefined,{maximumFractionDigits:0})+' booked</div></div>'+
       '<button class="btn" '+(p.ids.length?"":"disabled")+' onclick="programPDF()">PDF — lot checklists</button>'+
       '<button class="btn" '+(p.ids.length?"":"disabled")+' onclick="abateReportPDF()">PDF — abatement report</button></div>';
    if(rate===0) h+='<p class="note" style="color:var(--red)">Set your per-acre price in Library → Services (Weed Abatement) and revenue totals fill in automatically.</p>';
    if(p.ids.length){
      for(const id of p.ids){
        const a=findAcc(id); if(!a)continue;
        const st=progDone(id), m=meta[id]=meta[id]||{acres:0,rate:0};
        const lotRate=m.rate||rate;
        h+='<div class="biditem" style="align-items:center">'+
          '<span class="tick'+(st.complete?" on":"")+'">✓</span>'+
          '<div class="rmain" style="min-width:150px"><span class="rname'+(st.complete?" done":"")+'">'+esc(a.name)+'</span>'+
          '<span class="rsub">'+esc(a.addr)+'</span></div>'+
          '<div><label class="fl" style="margin:0 0 3px">Acres</label>'+
          '<input class="fi" style="width:74px;padding:8px" type="number" min="0" step="0.25" value="'+(m.acres||0)+'" onchange="abSet(\''+id+'\',\'acres\',this.value)"></div>'+
          '<div><label class="fl" style="margin:0 0 3px">$/acre</label>'+
          '<input class="fi" style="width:84px;padding:8px" type="number" min="0" step="10" value="'+lotRate+'" onchange="abSet(\''+id+'\',\'rate\',this.value)"></div>'+
          '<span class="pprice tabnum">$'+((m.acres||0)*lotRate).toLocaleString(undefined,{maximumFractionDigits:0})+'</span>'+
          '<span class="chip '+(st.complete?"done":st.done?"x":"tree")+'">'+st.done+'/'+st.total+'</span>'+
          '<button class="btn ghost" style="padding:8px 12px" onclick="openProg=\''+id+'\';setTab(\'programs\')">Checklist</button>'+
          '<button class="editbtn" style="background:#F6E3E0;color:var(--red)" onclick="progToggle(\''+id+'\')">✕</button>'+
          '</div>';
      }

    h+='<div class="secrow" style="margin-top:14px"><span class="sechead">Add lots</span></div>';
    h+='<p class="note" style="margin:0 0 8px">Vacant lots that aren\'t maintenance accounts: add them once with <b>+ Add account</b> on the Accounts tab (any tier, 0 bags), then enroll here.</p>';
    h+='<div class="toolrow"><input class="search" placeholder="Search accounts / lots…" value="'+esc(progSearch)+'" oninput="progSearch=this.value;render()"></div>';
    const abc=ACC().filter(a=>!p.ids.includes(a.id)&&a.name.toLowerCase().includes(progSearch.toLowerCase()));
    h+='<div class="board" style="max-height:180px">';
    abc.forEach(a=>{h+='<button class="bchip todo" onclick="progToggle(\''+a.id+'\')">'+
      '<span class="bchip-rt">'+a.route+'</span>🚜 '+esc(a.name)+'</button>';});
    h+='</div>';
  }

  /* ── ACCOUNT DETAIL ── */
  if(tab==="accounts"&&viewAcct){
    const a=findAcc(viewAcct);
    if(!a){viewAcct=null;}
    else{
      const w=working(a.id);
      h+='<div class="toolrow"><button class="btn ghost" onclick="viewAcct=null;render()">← All accounts</button>'+
         '<span style="flex:1"></span>'+
         '<button class="editbtn" onclick="openEditor(\''+a.id+'\')">Edit account</button></div>';
      h+='<div class="panel" style="display:block">'+
         '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+rchip(a.route)+
         '<div><div class="ptitle" style="font-size:16px">'+esc(a.name)+'</div>'+
         '<div class="psub">'+esc(a.addr)+'</div></div>'+
         '<span style="flex:1"></span>'+
         '<span class="chip bed">Mows '+a.day.slice(0,3)+'</span>'+
         '<span class="chip lawn">Tier '+a.tier+'</span>'+
         (a.trees?'<span class="chip tree">Trees</span>':"")+'</div>'+
         '<label class="fl" style="margin-top:12px">Property notes — gates, dogs, irrigation quirks, anything the crew should know</label>'+
         '<textarea class="fi" rows="3" style="resize:vertical" placeholder="e.g. Gate 8140 · dog in back Fri · zone 3 head leaks" oninput="setNote(\''+a.id+'\',this.value)">'+esc(S.acctNotes[a.id]||"")+'</textarea>'+
         '</div>';
      h+='<div class="toolrow">'+
         '<button class="btn orange" onclick="jumpAcct(\''+a.id+'\')">Log '+month+' work</button>'+
         '<button class="btn" onclick="openMods(\''+a.id+'\')">Adjust products</button>'+
         '<button class="btn" style="background:var(--sky)" onclick="newBid();const nb=S.bids[0];nb.client=\''+esc(a.name).replace(/'/g,"\'")+'\';nb.addr=\''+esc(a.addr).replace(/'/g,"\'")+'\';tab=\'bids\';render()">New bid here</button>'+
         '</div>';
      h+=svcStrip(a.id);
      // year plan
      const yr=acctYear(a);
      h+='<div class="secrow"><span class="sechead">'+year+' at this property</span></div>';
      if(!yr.length){h+='<div class="empty"><b>No applications scheduled.</b><p>This account may be trees-only or off the fert program — Edit account to change its tier.</p></div>';}
      else{
        h+='<div class="rbody" style="border-radius:14px;border-top:1px solid var(--line);margin-bottom:14px">';
        yr.forEach((r,i)=>{
          const full=r.done===r.total;
          h+='<button class="row" style="background:'+(full?"var(--green-lt)":i%2?"#FBFAF7":"#fff")+'" onclick="month=\''+r.m+'\';jumpAcct(\''+a.id+'\')">'+
             '<span class="tick'+(full?" on":"")+'" style="width:19px;height:19px">✓</span>'+
             '<span class="rmain"><span class="rname" style="font-size:13px">'+r.m+'</span>'+
             '<span class="rsub">'+
             [r.g?P(r.g).name:null,r.b?P(r.b).name:null,
              r.t?(r.t==="APHID"?"Aphid drench":"Deep-root"):null]
              .concat(r.x.map(x=>"+ "+P(x.code).name)).filter(Boolean).join(" · ")+'</span></span>'+
             '<span class="chip '+(full?"done":"bed")+'">'+r.done+'/'+r.total+'</span></button>';
        });
        h+='</div>';
      }
      // programs enrolled
      const enrolled=Object.keys(PROGS()).filter(k=>((S.programs[year+"-"+k]||{}).ids||[]).includes(a.id));
      if(enrolled.length){
        h+='<div class="secrow"><span class="sechead">Seasonal programs</span></div><div class="toolrow">'+
          enrolled.map(k=>'<button class="btn" onclick="progSel=\''+k+'\';openProg=\''+a.id+'\';setTab(\'programs\')">'+PROGS()[k].name.split(" (")[0]+'</button>').join("")+'</div>';
      }
      // bids at this property
      const abids=S.bids.filter(x=>x.client===a.name);
      if(abids.length){
        h+='<div class="secrow"><span class="sechead">Bids & jobs here</span></div>'+
           '<div class="rbody" style="border-radius:14px;border-top:1px solid var(--line);margin-bottom:14px">';
        abids.forEach((x,i)=>{
          h+='<button class="row" style="background:'+(i%2?"#FBFAF7":"#fff")+'" onclick="editingBid=\''+x.id+'\';setTab(\'bids\')">'+
             '<span class="rmain"><span class="rname" style="font-size:13px">'+x.items.length+' items · '+x.date+'</span>'+
             '<span class="rsub">'+x.status.toUpperCase()+'</span></span>'+
             '<span class="pprice tabnum">$'+bidTotal(x).toLocaleString(undefined,{maximumFractionDigits:0})+'</span></button>';
        });
        h+='</div>';
      }
      // history here
      const hh=historyRows().filter(r=>r.acct===a.name);
      h+='<div class="secrow"><span class="sechead">Everything we\'ve put down here ('+hh.length+')</span></div>';
      if(!hh.length){h+='<p class="note">Nothing logged yet — it starts recording the first time you log an application.</p>';}
      else{
        h+='<div class="rbody" style="border-radius:14px;border-top:1px solid var(--line)">';
        let lastMY="";
        hh.slice(0,60).forEach((r,i)=>{
          const my=r.month+" "+r.year;
          if(my!==lastMY){lastMY=my;
            h+='<div style="background:var(--navy);color:#fff;font-size:10px;font-weight:900;letter-spacing:.06em;padding:5px 12px">'+esc(my.toUpperCase())+'</div>';}
          h+='<div class="row" style="background:'+(i%2?"#FBFAF7":"#fff")+'">'+
             '<span class="chip '+(r.kind==="lawn"?"lawn":r.kind==="bed"?"bed":"tree")+'">'+r.kind+'</span>'+
             '<span class="rmain"><span class="rname" style="font-size:13px">'+esc(r.product)+'</span>'+
             '<span class="rsub">'+r.month+' '+r.year+' · '+esc(r.date)+'</span></span>'+
             '<span class="pprice tabnum">'+(r.kind==="tree"?"✓":q(r.qty))+'</span></div>';
        });
        h+='</div>';
      }
    }
  }

  /* ── ACCOUNTS ── */
  if(tab==="accounts"&&!viewAcct){
    h+='<div class="toolrow"><input class="search" placeholder="Search accounts…" value="'+esc(search)+'" oninput="search=this.value;render()">'+
       '<button class="btn green2" onclick="openEditor(null)">+ Add account</button></div>';
    h+='<div class="toolrow">'+
       '<button class="btn ghost" onclick="backup()">Backup</button>'+
       '<button class="btn ghost" onclick="restore()">Restore</button>'+
       (confirmReset
         ?'<button class="btn red" onclick="resetAll()">Confirm reset — erases all logs</button>'
         :'<button class="btn ghost" onclick="confirmReset=true;render()">Reset data</button>')+"</div>";
    const list=ACC().filter(a=>a.name.toLowerCase().includes(search.toLowerCase()));
    h+='<div class="rbody" style="border-radius:14px;border-top:1px solid var(--line)">';
    if(!list.length) h+='<div style="padding:26px;text-align:center;color:var(--muted);font-size:13px">No accounts match that search.</div>';
    list.forEach((a,i)=>{
      const w=working(a.id);
      const lL=S.baselines[a.id]&&S.baselines[a.id].lawn!==undefined&&S.baselines[a.id].lawn!==a.lawn;
      const lB=S.baselines[a.id]&&S.baselines[a.id].bed!==undefined&&S.baselines[a.id].bed!==a.bed;
      const custom=!DATA.accounts.some(x=>x.id===a.id);
      h+='<div class="row" style="background:'+(i%2?"#FBFAF7":"#fff")+'">'+
         rchip(a.route)+
         '<button class="rmain" style="text-align:left" onclick="openAcct(\''+a.id+'\')"><span class="rname" style="color:var(--sky);text-decoration:underline;text-decoration-color:#C9D4E4">'+esc(a.name)+(custom?' <span class="tagnew">NEW</span>':"")+'</span>'+
         '<span class="rsub">mows '+a.day.slice(0,3)+' · Tier '+a.tier+(a.trees?" · trees":"")+(S.acctNotes[a.id]?" · 📝":"")+"</span></button>"+
         (a.lawn>0||(S.baselines[a.id]&&S.baselines[a.id].lawn!==undefined)
           ?stepper(a.id,"lawn","Lawn",w.lawn,lL):'<span class="nolabel">no grass</span>')+
         (a.bed>0||(S.baselines[a.id]&&S.baselines[a.id].bed!==undefined)
           ?stepper(a.id,"bed","Beds",w.bed,lB):'<span class="nolabel">no beds</span>')+
         '<button class="editbtn" onclick="openEditor(&quot;'+a.id+'&quot;)">Edit</button></div>';
    });
    h+="</div>";
    const gone=Object.keys(S.edits).filter(k=>S.edits[k].removed);
    if(gone.length){
      h+='<div class="secrow" style="margin-top:18px"><span class="sechead">Removed accounts</span></div>'+
         '<div class="rbody" style="border-radius:14px;border-top:1px solid var(--line)">';
      gone.forEach(id=>{
        const a=DATA.accounts.find(x=>x.id===id); if(!a) return;
        h+='<div class="row"><span class="rmain"><span class="rname" style="color:var(--ghost);text-decoration:line-through">'+esc(a.name)+'</span>'+
           '<span class="rsub">off the program</span></span>'+
           '<button class="btn ghost" onclick="restoreRemoved(&quot;'+id+'&quot;)">Put back</button></div>';
      });
      h+="</div>";
    }
    h+='<p class="note">Orange dot = the app learned this number from logged usage. Tap <b>Edit</b> to change any account, or <b>+ Add account</b> for new work. Backup downloads your data as a file — do it once in a while.</p>';
  }

  h+="</main>";
  h+=editorHTML();
  h+=prodHTML();
  h+=modsHTML();
  h+=progEditorHTML();
  h+=svcEditorHTML();
  h+=diagEditorHTML();
  h+=treeEditorHTML();
  h+=v4ProfileHTML();
  h+=v4WalkHTML();
  document.getElementById("app").innerHTML=h;
}



/* ═══════════ V4 ACCOUNT COMMAND + WALK-THROUGH ═══════════ */
let v4Search="",v4Filter="all",v4Acct=null,v4Walk=null;
const V4_PROGRAMS=[
  ["fert","🌿 Fertilizer"],["weed","🧪 Weed"],["fungus","🍄 Fungus"],["seed","🌱 Seed"],
  ["aerate","🕳️ Aeration"],["dethatch","🧹 Dethatch"],["irrigation","💧 Irrigation"],
  ["trees","🌳 Trees"],["shrubs","🌹 Shrubs"],["insects","🐛 Insects"],["abate","🚜 Abatement"]
];
const V4_WALK=[
 ["overall","Overall appearance acceptable"],["color","Turf color healthy"],["density","Turf density acceptable"],
 ["weeds","No significant weeds"],["disease","No fungus or disease symptoms"],["water","No dry, soggy, runoff, or pooling areas"],
 ["controller","Irrigation controller and schedule checked"],["heads","Heads, valves, drip, and coverage checked"],
 ["trees","Tree leaves, canopy, trunk, roots, insects, and clearance checked"],["shrubs","Shrubs, roses, flowers, pests, and drip checked"],
 ["soil","Soil condition reviewed; pH recorded only if tested"],["safety","Hardscape, trip hazards, debris, and safety checked"]
];
function v4Ensure(){
  if(!S.v4)S.v4={accounts:{},walks:[],actions:[],version:1};
  S.v4.accounts=S.v4.accounts||{};S.v4.walks=S.v4.walks||[];S.v4.actions=S.v4.actions||[];

/* ═══════════ PHOTOS (IndexedDB) ═══════════ */
const photoCache={};
function pdb(){return new Promise((res,rej)=>{
  if(typeof indexedDB==="undefined"){rej(new Error("no idb"));return;}
  const r=indexedDB.open("cvcs-fert-photos",1);
  r.onupgradeneeded=()=>{r.result.createObjectStore("photos",{keyPath:"id"});};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
async function photoPut(id,dataUrl){try{const db=await pdb();
  await new Promise((res,rej)=>{const tx=db.transaction("photos","readwrite");
    tx.objectStore("photos").put({id:id,data:dataUrl});
    tx.oncomplete=res; tx.onerror=()=>rej(tx.error);});
  photoCache[id]=dataUrl;}catch(e){photoCache[id]=dataUrl;}}
async function photoGet(id){if(photoCache[id])return photoCache[id];
  try{const db=await pdb();
    const rec=await new Promise((res,rej)=>{const rq=db.transaction("photos").objectStore("photos").get(id);
      rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);});
    if(rec){photoCache[id]=rec.data;return rec.data;}}catch(e){}
  return null;}
async function photoDel(id){delete photoCache[id];
  try{const db=await pdb();
    await new Promise((res,rej)=>{const tx=db.transaction("photos","readwrite");
      tx.objectStore("photos").delete(id); tx.oncomplete=res; tx.onerror=rej;});}catch(e){}}
function compressImage(file){return new Promise((res,rej)=>{
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();
    img.onload=()=>{const MAX=900;
      let w=img.width,h=img.height;
      if(w>h&&w>MAX){h=h*MAX/w;w=MAX;}else if(h>MAX){w=w*MAX/h;h=MAX;}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",0.65));};
    img.onerror=rej; img.src=rd.result;};
  rd.onerror=rej; rd.readAsDataURL(file);});}

/* ═══════════ MONTH MODS: swap / add treatments per account ═══════════ */
const mk=()=>year+"-"+month;
function modOf(id,m,yr){const key=(yr||year)+"-"+(m||month);return (S.monthMods[key]||{})[id]||null;}
let editingMods=null, modsDraft=null;

function openMods(id){
  const cur=modOf(id)||{};
  const a=findAcc(id);
  modsDraft={id:id,lawn:cur.lawn||"",bed:cur.bed||"",
    extras:(cur.extras||[]).map(x=>({code:x.code,qty:x.qty,note:x.note||""}))};
  editingMods=id; confirmDel=false; render();
}
function closeMods(){editingMods=null;modsDraft=null;render();}
function dSwap(kind,v){if(modsDraft)modsDraft[kind]=v;}
function dExtra(i,f,v){if(modsDraft&&modsDraft.extras[i])modsDraft.extras[i][f]=f==="qty"?(parseFloat(v)||0):v;}
function dAddExtra(){
  if(!modsDraft)return;
  const first=Object.keys(PROD()).filter(c=>!["tree","gear"].includes(P(c).kind))[0]||"DIM";
  modsDraft.extras.push({code:first,qty:1,note:""}); render();
}
function dRmExtra(i){if(!modsDraft)return; modsDraft.extras.splice(i,1); render();}
async function saveMods(){
  if(!modsDraft)return;
  const rec={};
  if(modsDraft.lawn) rec.lawn=modsDraft.lawn;
  if(modsDraft.bed) rec.bed=modsDraft.bed;
  const ex=modsDraft.extras.filter(x=>x.code&&x.qty>0);
  if(ex.length) rec.extras=ex;
  S.monthMods[mk()]=S.monthMods[mk()]||{};
  if(Object.keys(rec).length) S.monthMods[mk()][modsDraft.id]=rec;
  else delete S.monthMods[mk()][modsDraft.id];
  if(!Object.keys(S.monthMods[mk()]).length) delete S.monthMods[mk()];
  editingMods=null; modsDraft=null; await save();
}
async function clearMods(){
  if(S.monthMods[mk()]) delete S.monthMods[mk()][editingMods];
  if(S.monthMods[mk()]&&!Object.keys(S.monthMods[mk()]).length) delete S.monthMods[mk()];
  editingMods=null; modsDraft=null; await save();
}

/* ═══════════ HISTORY + FORECAST + STEPS ═══════════ */
function historyRows(){
  const out=[];
  Object.keys(S.logs).forEach(k=>{
    const L=S.logs[k]; if(!L||!L.done) return;
    const parts=k.split("-");                      // year-Month-<id...>-kind
    const yr=parts[0], mo=parts[1], kind=parts[parts.length-1];
    const id=parts.slice(2,parts.length-1).join("-");
    const a=findAcc(id)||DATA.accounts.find(x=>x.id===id)||{name:id,route:"?",day:""};
    let code=null;
    const mod=modOf(id,mo,yr);
    if(kind==="lawn") code=(mod&&mod.lawn)||(DATA.grassCal[a.tier]||{})[mo];
    else if(kind==="bed") code=(mod&&mod.bed)||(DATA.bedCal[a.tier]||{})[mo];
    else if(kind==="seed"){const asp=S.aerseed[yr]; code=(asp&&asp.cfg[id])?asp.cfg[id].seed:null;}
    else if(kind==="aer"){code=null;}
    else if(kind.charAt(0)==="x"){const i=parseInt(kind.slice(1)); code=(mod&&mod.extras&&mod.extras[i])?mod.extras[i].code:null;}
    else code=DATA.treeCal[mo];
    out.push({key:k,date:L.date||"",year:yr,month:mo,acct:a.name,route:a.route,kind:kind,
      code:code,product:code?P(code).name:(kind==="aer"?"Core Aeration (service)":"—"),qty:L.actual||0});
  });
  out.sort((x,y)=>(y.date||"").localeCompare(x.date||""));
  return out;
}
function histTotals(rows){
  const t={};
  rows.forEach(r=>{if(r.code&&r.kind!=="tree") t[r.code]=(t[r.code]||0)+r.qty;});
  return t;
}
function forecastRows(){
  const startIdx=MONTHS.indexOf(month);
  return MONTHS.slice(startIdx).map(m=>{
    const oR=orderRows(m);
    return {month:m,stops:planFor(m).length,cost:oR.reduce((s,r)=>s+r.cost,0),
      units:oR.reduce((s,r)=>s+r.units,0),products:oR};
  }).filter(r=>r.stops>0);
}

function acctYear(a){
  return MONTHS.map(m=>{
    const key=year+"-"+m, mod=(S.monthMods[key]||{})[a.id];
    let g=a.lawn>0?(DATA.grassCal[a.tier]||{})[m]:null;
    let b=a.bed>0?(DATA.bedCal[a.tier]||{})[m]:null;
    const t=a.trees?DATA.treeCal[m]:null;
    if(mod){if(g&&mod.lawn)g=mod.lawn; if(b&&mod.bed)b=mod.bed;}
    const x=(mod&&mod.extras)||[];
    if(!g&&!b&&!t&&!x.length) return null;
    const done=["lawn","bed","tree"].concat(x.map((_,i)=>"x"+i))
      .filter(k=>{const need=(k==="lawn"&&g)||(k==="bed"&&b)||(k==="tree"&&t)||k.charAt(0)==="x";
        return need&&S.logs[year+"-"+m+"-"+a.id+"-"+k]&&S.logs[year+"-"+m+"-"+a.id+"-"+k].done;}).length;
    const total=(g?1:0)+(b?1:0)+(t?1:0)+x.length;
    return {m:m,g:g,b:b,t:t,x:x,done:done,total:total};
  }).filter(Boolean);
}

function agExpand(x){
  const out=[];
  const dot=s=>s==="done"?"#2D7A33":s==="part"?"#E3B015":s==="sched"?"#2E4C8E":"#C43A26";
  if(x.go==="schedule"){
    planFor(month).forEach(r=>{const st=status(r);
      out.push({t:r.a.name,s:null,dot:dot(boardStatus(r)),chip:st.done.length+"/"+st.total,chipc:st.complete?"done":"bed",
        act:"jumpAcct('"+r.a.id+"')"});});
  }else if(x.go==="aerseed"){
    asRowsFor(month).forEach(r=>{const st=asStatus(r.a.id,month);
      out.push({t:r.a.name,s:(r.cfg.aer?"Aerate + ":"")+P(r.cfg.seed).name.split(" (")[0]+" ×"+q(r.cfg.bags),
        dot:st.complete?"#2D7A33":st.done?"#E3B015":"#C43A26",chip:st.done+"/"+st.total,chipc:st.complete?"done":"bed",
        act:"setTab('aerseed')"});});
  }else if(x.go==="lights"){
    lightAccts().forEach(a=>{const due=lightDue(a.id);const L=S.lighting[a.id];
      out.push({t:a.name,s:L.last?"Last "+L.last:"Never checked",dot:due?"#C43A26":"#2D7A33",
        chip:due?"DUE":"OK",chipc:due?"x":"done",act:"openLight='"+a.id+"';setTab('lights')"});});
  }else if(x.go==="trees"){
    const tcode=DATA.treeCal[month];
    ACC().filter(a=>a.trees).forEach(a=>{
      const L=S.logs[year+"-"+month+"-"+a.id+"-tree"], did=L&&L.done;
      const pd=S.programs[year+"-TREEPRO"], onCk=pd&&pd.ids.includes(a.id);
      let sub=tcode?((tcode==="APHID"?"Aphid drench":"Deep-root feed")+(did?" ✓ done":" — due")):"Next: "+(MONTHS.indexOf(month)<3?"April drench":MONTHS.indexOf(month)<8?"April ✓ · Sept feed":"done for the year");
      if(onCk){const prev=progSel;progSel="TREEPRO";const st=progDone(a.id);progSel=prev;sub+=" · checklist "+st.done+"/"+st.total;}
      out.push({t:a.name,s:sub,dot:tcode?(did?"#2D7A33":"#C43A26"):"#2D7A33",
        chip:tcode?(did?"✓":"DUE"):null,chipc:did?"done":"x",
        act:tcode&&!did?"month='"+month+"';jumpAcct('"+a.id+"')":"openAcct('"+a.id+"')"});
    });
  }else if(x.go==="bids"){
    S.bids.filter(b=>b.status==="progress").forEach(b=>{
      out.push({t:b.client||"(no name)",s:b.items.length+" items",dot:"#E3B015",
        chip:"$"+bidTotal(b).toLocaleString(undefined,{maximumFractionDigits:0}),chipc:"lawn",
        act:"editingBid='"+b.id+"';setTab('bids')"});});
  }else if(x.sel){
    const pd=S.programs[year+"-"+x.sel];
    if(pd){const prev=progSel;progSel=x.sel;
      pd.ids.forEach(id=>{const a=findAcc(id);if(!a)return;const st=progDone(id);
        out.push({t:a.name,s:null,dot:st.complete?"#2D7A33":st.done?"#E3B015":"#C43A26",
          chip:st.done+"/"+st.total,chipc:st.complete?"done":"bed",
          act:"progSel='"+x.sel+"';openProg='"+id+"';setTab('"+(x.sel==="ABATEP"?"abate":"programs")+"')"});});
      progSel=prev;}
  }
  return out;
}

function monthParts(a){
  const key=year+"-"+month, mod=(S.monthMods[key]||{})[a.id];
  let g=a.lawn>0?(DATA.grassCal[a.tier]||{})[month]:null;
  let b=a.bed>0?(DATA.bedCal[a.tier]||{})[month]:null;
  const t=a.trees?DATA.treeCal[month]:null;
  if(mod){if(g&&mod.lawn)g=mod.lawn; if(b&&mod.bed)b=mod.bed;}
  const x=(mod&&mod.extras)||[];
  const parts=[];
  const dn=k=>{const L=S.logs[key+"-"+a.id+"-"+k];return !!(L&&L.done);};
  if(g)parts.push({lab:P(g).name,tag:"lawn",done:dn("lawn")});
  if(b)parts.push({lab:P(b).name,tag:"beds",done:dn("bed")});
  if(t)parts.push({lab:t==="APHID"?"Aphid drench":"Deep-root feed",tag:"tree",done:dn("tree")});
  x.forEach((e,i)=>parts.push({lab:P(e.code).name,tag:"extra",done:dn("x"+i)}));
  return parts;
}

function usageStats(){
  const bytes=JSON.stringify(S).length;
  const yrs={};
  Object.keys(S.logs).forEach(k=>{const y=k.split("-")[0];yrs[y]=(yrs[y]||0)+1;});
  return {kb:Math.round(bytes/1024),logs:Object.keys(S.logs).length,docs:(S.docs||[]).length,
    bids:S.bids.length,doneBids:S.bids.filter(b=>b.status==="done").length,years:yrs};
}
async function purgeYear(y){
  y=String(y);
  backup(); // safety download first
  Object.keys(S.logs).forEach(k=>{if(k.split("-")[0]===y)delete S.logs[k];});
  Object.keys(S.labor).forEach(k=>{if(k.split("-")[0]===y)delete S.labor[k];});
  Object.keys(S.programs).forEach(k=>{if(k.split("-")[0]===y)delete S.programs[k];});
  delete S.aerseed[y]; delete S.abateMeta[y];
  S.docs=(S.docs||[]).filter(d=>!(d.year&&String(d.year)===y));
  confirmDel=false; await save();
}
async function trimDocs(){S.docs=(S.docs||[]).slice(0,15);await save();}
async function clearDoneBids(){
  backup();
  S.bids=S.bids.filter(b=>b.status!=="done");
  confirmDel=false; await save();
}

function logLine(id,kind,label,planned,log,noQty){
  if(log&&log.done){
    return '<div class="logline done"><span class="loglab g">✓ '+esc(label)+
      (noQty?"":" — "+q(log.actual)+" bag"+(log.actual===1?"":"s"))+" · "+log.date+"</span>"+
      '<button class="btn green" onclick="undoApp(\''+id+'\',\''+kind+'\')">Undo</button></div>';
  }
  const key=lk(id,kind);
  const val=pendingVals[key]!==undefined?pendingVals[key]:planned;
  return '<div class="logline"><span class="loglab">'+esc(label)+"</span>"+
    (noQty?"":'<span class="step"><button class="sbtn" onclick="bump(\''+key+'\','+planned+',-0.5)">−</button>'+
      '<span class="sval tabnum">'+q(val)+'</span>'+
      '<button class="sbtn" onclick="bump(\''+key+'\','+planned+',0.5)">+</button></span>')+
    '<button class="btn orange" onclick="logApp(\''+id+'\',\''+kind+'\','+(noQty?0:val)+')">'+(noQty?"Mark done":"Log it")+"</button></div>";
}
function stepper(id,kind,lab,val,learned){
  return '<span class="astep"><span class="aslab">'+lab+'</span>'+
    '<button class="asbtn" onclick="setBase(\''+id+'\',\''+kind+'\','+((+val)-0.5)+')">−</button>'+
    '<span class="asval tabnum">'+q(val)+(learned?'<span class="dot"></span>':"")+"</span>"+
    '<button class="asbtn" onclick="setBase(\''+id+'\',\''+kind+'\','+((+val)+0.5)+')">+</button></span>';
}
