<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fert CVCS">
<meta name="theme-color" content="#FFFBEF">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>CVCS Fertilizer Platinum v4.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --orange:#E86010; --orange-lt:#FDEADD; --navy:#202938; --navy-lt:#2c3a4f; --gold:#C8A951;
    --paper:#F5F4F0; --card:#FFFFFF; --line:#E3E1DA; --line-lt:#EEECE6;
    --ink:#1C2430; --muted:#6B7280; --faint:#8A8F98; --ghost:#B6B2A7;
    --green:#3F7A3F; --green-lt:#EEF6EE; --green-chip:#DCEFDC; --red:#B3402A;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);
       padding-top:env(safe-area-inset-top)}
  button{font-family:inherit;border:none;cursor:pointer;background:none}
  input{font-family:inherit}
  .tabnum{font-variant-numeric:tabular-nums}

  header{background:var(--navy);position:sticky;top:0;z-index:30}
  .hwrap{max-width:960px;margin:0 auto;padding:12px 16px 0}
  .hrow{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44px;border-radius:10px;background:var(--orange);color:#fff;font-size:26px;font-weight:900;
        display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .htitle{color:#fff;font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.15}
  .hsub{color:#9AA4B2;font-size:11px;margin-top:1px}
  .save{margin-left:auto;font-size:11px;font-weight:700;color:#8FD694;min-width:52px;text-align:right}
  .save.err{color:#FF8F6B}
  .tabs{display:flex;gap:2px;margin-top:10px}
  .tab{padding:10px 16px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
       color:#9AA4B2;border-radius:10px 10px 0 0}
  .tab.on{background:var(--paper);color:var(--orange)}

  main{max-width:960px;margin:0 auto;padding:16px}
  .mstrip{display:flex;gap:6px;overflow-x:auto;padding:14px 16px 4px;max-width:960px;margin:0 auto;
          scrollbar-width:none}
  .mstrip::-webkit-scrollbar{display:none}
  .mpill{padding:9px 13px;border-radius:10px;font-size:11px;font-weight:800;letter-spacing:.08em;
         text-transform:uppercase;flex-shrink:0;color:#fff;background:var(--navy);opacity:.85}
  .mpill.dim{background:#E3E1DA;color:#8A8F98;opacity:1}
  .mpill.on{background:var(--orange);opacity:1}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .cnum{font-size:24px;font-weight:900;color:var(--navy)}
  .cnum .sub{font-size:15px;font-weight:700;color:#9AA4B2}
  .cnum.orange{color:var(--orange)}
  .clab{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}

  .secrow{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;gap:10px;flex-wrap:wrap}
  .sechead{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
  .btn{padding:10px 16px;border-radius:10px;font-size:11px;font-weight:800;letter-spacing:.08em;
       text-transform:uppercase;color:#fff;background:var(--navy)}
  .btn.orange{background:var(--orange)}
  .btn.ghost{background:#E3E1DA;color:var(--muted)}
  .btn.green{background:var(--green-chip);color:var(--green)}
  .btn.red{background:var(--red)}
  .btn:disabled{background:#C9C6BD}

  .rblock{margin-bottom:16px}
  .rbar{display:flex;align-items:center;gap:10px;background:var(--navy);border-radius:12px 12px 0 0;padding:7px 12px}
  .rchip{width:26px;height:26px;border-radius:7px;background:var(--orange);color:#fff;font-weight:900;font-size:14px;
         display:flex;align-items:center;justify-content:center}
  .rlab{color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .rmeta{margin-left:auto;color:#9AA4B2;font-size:11px;font-weight:700}
  .rbody{border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;overflow:hidden;background:var(--card)}

  .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;
       border-top:1px solid var(--line-lt);background:var(--card)}
  .row:first-child{border-top:none}
  .row.done{background:var(--green-lt)}
  .row.picked{background:var(--orange-lt)}
  .tick{width:22px;height:22px;border-radius:50%;border:2px solid #C9C6BD;flex-shrink:0;display:flex;
        align-items:center;justify-content:center;font-size:11px;font-weight:900;color:transparent}
  .tick.sq{border-radius:6px}
  .tick.on{border-color:var(--green);background:var(--green);color:#fff}
  .tick.on.orange{border-color:var(--orange);background:var(--orange)}
  .rmain{min-width:0;flex:1}
  .rname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rname.done{color:var(--green);text-decoration:line-through}
  .rsub{font-size:11px;color:var(--faint);margin-top:1px}
  .chips{display:flex;gap:5px;flex-shrink:0}
  .chip{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
  .chip.lawn{background:var(--orange-lt);color:#B05A10}
  .chip.bed{background:#EEF1F6;color:var(--navy)}
  .chip.tree{background:#F3EEE6;color:var(--muted)}
  .chip.done{background:var(--green-chip);color:var(--green)}

  .expand{padding:6px 12px 12px;border-top:1px dashed var(--line);display:grid;gap:8px;background:inherit}
  .logline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FBFAF7;border:1px solid var(--line-lt);
           border-radius:10px;padding:9px 12px}
  .logline.done{background:var(--green-lt);border-color:var(--green-chip)}
  .loglab{font-size:12px;font-weight:700;color:var(--navy);flex:1;min-width:140px}
  .loglab.g{color:var(--green)}
  .step{display:flex;align-items:center;gap:5px}
  .sbtn{width:34px;height:34px;border-radius:9px;background:#E3E1DA;color:var(--navy);font-size:19px;font-weight:900}
  .sval{width:42px;text-align:center;font-weight:900;font-size:15px;color:var(--orange)}

  .empty{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:34px;text-align:center}
  .empty b{font-size:16px;color:var(--navy)}
  .empty p{font-size:13px;color:var(--muted);margin-top:5px}

  .orow{display:flex;align-items:center;gap:12px;padding:12px;border-top:1px solid var(--line-lt)}
  .orow:first-child{border-top:none}
  .ototal{display:flex;justify-content:space-between;align-items:center;padding:13px 12px;background:var(--orange-lt);
          font-weight:800}
  .note{font-size:12px;color:var(--faint);margin-top:12px;line-height:1.5}

  .search{flex:1;padding:11px 13px;border-radius:10px;border:1px solid #D8D5CC;font-size:14px;font-weight:600;
          outline:none;background:var(--card);color:var(--ink)}
  .astep{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .aslab{font-size:9px;font-weight:800;text-transform:uppercase;color:var(--faint);width:32px;text-align:right}
  .asbtn{width:30px;height:30px;border-radius:8px;background:#E3E1DA;color:var(--navy);font-weight:900;font-size:16px}
  .asval{width:34px;text-align:center;font-weight:900;font-size:13px;color:var(--navy);position:relative}
  .dot{position:absolute;top:-2px;right:-1px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
  .nolabel{font-size:11px;font-weight:600;color:var(--ghost);width:104px;text-align:center;flex-shrink:0}

  .toolrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .datein{padding:9px 11px;border-radius:10px;border:1px solid #D8D5CC;font-size:13px;background:var(--card)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:14px;
         display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ptitle{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--navy)}
  .psub{font-size:11px;color:var(--faint);margin-top:2px}



  :root{--teal:#2E6F8E; --sky:#202938; --sage:#6B7280;
    --forest:#202938; --leaf:#E86010; --clay:#E86010; --cream:#FFFBEF}
  body::before{content:"";position:fixed;top:6px;left:0;right:0;height:5px;background:var(--orange);z-index:40}
  #wm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:0;pointer-events:none;overflow:hidden}
  #wm span{font-size:34vw;font-weight:900;color:rgba(232,96,16,.06);transform:rotate(-16deg);letter-spacing:-.05em;white-space:nowrap;user-select:none}
  #app{position:relative;z-index:1}
  header{background:#FFFBEF;border-bottom:2px solid var(--orange)}
  .logo{background:var(--orange);font-size:22px}
  .htitle{color:var(--navy);font-size:15px}
  .hsub{color:#8A6D3B;font-weight:700}
  .save{color:#2D7A33}
  .tabs{background:var(--navy);border-radius:10px 10px 0 0;padding:0 6px;margin-top:12px}
  .tabs .tab{color:#9AA4B2;border-radius:0;border-bottom:3px solid transparent;padding:11px 14px}
  .tab.on{background:transparent;color:#fff;border-bottom-color:var(--orange)}
  .mpill{background:var(--navy)}
  .mpill.on{background:var(--orange)}
  .mpill.dim{background:#E3E1DA;color:#8A8F98}
  .dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  .dcard{border-radius:14px;padding:16px;text-align:left;color:#fff;border:1px solid var(--line);
         box-shadow:0 2px 8px rgba(32,41,56,.12)}
  .dcard.g1{background:var(--orange)}
  .dcard.g2{background:var(--navy)}
  .dcard.g3{background:#6B7280}
  .dcard.g4{background:#FFF3C4;color:var(--navy)}
  .dcard.g4 .dbar{background:rgba(32,41,56,.15)}
  .dcard.g4 .dfill{background:var(--navy)}
  .dnum{font-size:32px;font-weight:900;line-height:1}
  .dnum .dsub{font-size:17px;font-weight:700;opacity:.75}
  .dlab{font-size:11.5px;font-weight:800;margin-top:6px;opacity:.95;letter-spacing:.04em;text-transform:uppercase}
  .dbar{height:6px;background:rgba(255,255,255,.28);border-radius:3px;margin-top:10px;overflow:hidden}
  .dfill{height:100%;background:#fff;border-radius:3px}
  .rbar{background:var(--navy)}
  .rchip{background:var(--orange)}
  .btn{background:var(--navy)}
  .btn.orange{background:var(--orange)}
  .btn.green{background:var(--green-chip);color:var(--green)}
  .btn.green2{background:var(--orange)}
  .btn.ghost{background:#E3E1DA;color:var(--muted)}
  .btn.red{background:#B3402A}
  .sbtn,.asbtn{background:#E9E5DA;color:var(--navy)}
  .sval{color:var(--orange)}
  .mhead{background:var(--navy)}
  .lbtn.on{background:var(--orange)}
  .stepno{background:var(--orange)}
  .chip.lawn{background:var(--orange-lt);color:#B05A10}
  .chip.bed{background:#EEF1F6;color:var(--navy)}
  .chip.x{background:#FFF3C4;color:#8A6D3B}
  .tick.on{border-color:#2D7A33;background:#2D7A33}
  .tick.on.orange{border-color:var(--orange);background:var(--orange)}
  .row.picked{background:var(--orange-lt)}
  .cnum.orange{color:var(--orange)}




  .svcstrip{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
  .svcchip{font-size:11px;font-weight:800;padding:6px 11px;border-radius:9px;border:1.5px dashed var(--line);
           background:#fff;color:var(--muted)}
  .svcchip.on{border-style:solid;border-color:#B8DDB8;background:#EAF6EA;color:#225C28}
  .svcchip.on.due{border-color:#F0B9B0;background:#FDEBE7;color:#9E2B18}
  .yrbanner{background:#E3B015;color:#3A2E05;font-size:11px;font-weight:900;text-align:center;padding:5px 10px;letter-spacing:.03em}
  .yrsw{display:flex;align-items:center;gap:2px;margin-left:10px;background:rgba(255,255,255,.08);border-radius:10px;padding:3px}
  .ybtn{width:28px;height:28px;border-radius:8px;color:#C9CDD4;font-weight:900;font-size:15px}
  .ybtn:active{background:rgba(255,255,255,.15)}
  .yval{color:#fff;font-weight:900;font-size:12.5px;padding:0 4px}
  .estbtn{margin-left:10px;background:var(--orange);color:#fff;font-weight:900;font-size:12px;border-radius:10px;padding:9px 14px;flex-shrink:0}
  .mdetail{background:#FBFAF7;border-top:1px dashed var(--line);padding:8px 12px;display:grid;gap:5px}
  .mpart{display:flex;align-items:center;gap:8px}
  .labline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FFF6E8;border:1px solid #F2DCBB;
           border-radius:10px;padding:7px 10px;margin:2px 0 6px}
  .labf{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--muted)}
  .agbody{background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;display:grid}
  .agrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
         border-radius:12px;padding:11px 14px;text-align:left}
  .agdot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  .agrow.agdone .agdot{background:#2D7A33}
  .agrow.agpart .agdot{background:#E3B015}
  .agrow.agtodo .agdot{background:#C43A26}
  .agt{font-weight:800;font-size:13.5px;color:var(--navy)}
  .ags{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px;font-size:11px;font-weight:800}
  .lg.done{color:#2D7A33}.lg.part{color:#B0790F}.lg.sched{color:#2E4C8E}.lg.todo{color:#8A8F98}
  .board{display:flex;flex-wrap:wrap;gap:5px;max-height:250px;overflow-y:auto;background:var(--card);
         border:1px solid var(--line);border-radius:14px;padding:10px}
  .bchip{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:5px 9px 5px 6px;
         border-radius:7px;border:1px solid transparent;max-width:100%;white-space:nowrap;overflow:hidden;
         text-overflow:ellipsis;color:var(--ink)}
  .bchip-rt{font-size:8.5px;font-weight:900;background:rgba(32,41,56,.12);border-radius:4px;padding:1px 4px;flex-shrink:0}
  .bchip.done{background:#DCEFDC;border-color:#B8DDB8;color:#225C28;text-decoration:line-through}
  .bchip.part{background:#FFF3C4;border-color:#EAD98F;color:#6E5A13}
  .bchip.sched{background:#DFE9F8;border-color:#BBCDEB;color:#24407A}
  .bchip.todo{background:#F1EFE9;border-color:#E0DDD2;color:#6B7280}
  .sevchip{font-size:9px;font-weight:900;letter-spacing:.05em;padding:3px 8px;border-radius:6px;flex-shrink:0}
  .sevchip.high{background:#FBDAD5;color:#9E2B18}
  .sevchip.med{background:#FFF3C4;color:#8A6D3B}
  .sevchip.low{background:#DCEFDC;color:#2D7A33}
  .diagbody{padding:4px 14px 14px;border-top:1px dashed var(--line);display:grid;gap:8px;background:#FBFAF7}
  .dsec{font-size:12.5px;line-height:1.5;color:var(--ink)}
  .dsec.fix{background:var(--orange-lt);border-radius:8px;padding:8px 10px}
  .dtag{display:block;font-size:9px;font-weight:900;letter-spacing:.09em;color:var(--orange);margin-bottom:2px}
  .biditem{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
           padding:12px;margin-bottom:10px;flex-wrap:wrap}
  .bphotowrap{display:flex;flex-direction:column;gap:6px;width:130px;flex-shrink:0}
  .bphoto{width:130px;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .bphoto.empty2{display:flex;align-items:center;justify-content:center;background:#F0EEE8;
                 color:var(--ghost);font-size:11px;font-weight:700}
  .bfields{flex:1;min-width:220px;display:grid;gap:8px}
  @media(max-width:560px){.dgrid{grid-template-columns:1fr 1fr}.dnum{font-size:26px}}
  .exrow{display:flex;gap:6px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
  .chip.x{background:#EDE4F5;color:#5B3E86}
  .langbar{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .lbtn{padding:8px 13px;border-radius:9px;font-size:11px;font-weight:800;letter-spacing:.06em;
        text-transform:uppercase;background:#E3E1DA;color:var(--muted)}
  .lbtn.on{background:var(--green);color:#fff}
  .stepwrap{margin:-2px 0 4px}
  .steps{background:#FBFAF7;border:1px solid var(--line-lt);border-radius:10px;padding:11px 12px}
  .stepitem{display:flex;gap:9px;padding:5px 0;border-top:1px solid var(--line-lt)}
  .stepitem:first-child{border-top:none;padding-top:0}
  .stepno{width:19px;height:19px;border-radius:50%;background:var(--green);color:#fff;font-size:10px;
          font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
  .steptext{font-size:12.5px;line-height:1.45}
  .sen{display:block;color:var(--ink)}
  .ses{display:block;color:var(--muted);font-style:italic;margin-top:2px}
  .safety{margin-top:9px;padding:9px 10px;background:var(--orange-lt);border-radius:8px;font-size:11.5px;
          line-height:1.45;color:#7a3d0a}
  .safety b{letter-spacing:.06em}
  .pprice{display:block;font-weight:900;font-size:14px;color:var(--navy)}
  .editbtn{padding:7px 12px;border-radius:8px;background:#EEF1F6;color:var(--navy);font-size:11px;
           font-weight:800;letter-spacing:.05em;text-transform:uppercase;flex-shrink:0}
  .btn.green2{background:var(--green)}
  .tagnew{background:var(--green-chip);color:var(--green);font-size:9px;font-weight:800;padding:2px 6px;
          border-radius:5px;letter-spacing:.06em;vertical-align:middle}
  .modalwrap{position:fixed;inset:0;background:rgba(20,26,36,.62);z-index:60;display:flex;
             align-items:flex-end;justify-content:center;padding:0}
  .modal{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92vh;
         display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.3)}
  .mhead{display:flex;align-items:center;padding:16px 18px;background:var(--navy);border-radius:18px 18px 0 0;
         color:#fff;font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
  .xbtn{margin-left:auto;color:#9AA4B2;font-size:20px;font-weight:700;padding:0 4px}
  .mbody{padding:16px 18px;overflow-y:auto}
  .mfoot{display:flex;gap:8px;align-items:center;padding:13px 18px;border-top:1px solid var(--line);
         background:#FBFAF7;border-radius:0 0 0 0;flex-wrap:wrap;
         padding-bottom:calc(13px + env(safe-area-inset-bottom))}
  .fl{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
      color:var(--muted);margin:12px 0 5px}
  .mbody .fl:first-child{margin-top:0}
  .fi{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #D8D5CC;font-size:15px;
      background:#fff;color:var(--ink);outline:none;-webkit-appearance:none}
  .fi:focus{border-color:var(--green)}
  .frow{display:flex;gap:10px}
  .frow>div{flex:1;min-width:0}
  .fhint{font-size:11px;color:var(--faint);margin-top:6px;line-height:1.45}
  .fchk{display:flex;align-items:center;gap:9px;margin-top:16px;font-size:14px;font-weight:600;color:var(--ink)}

/* CVCS Platinum v4 Command Center */
.v4-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.v4-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.v4-kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.v4-kpi b{display:block;font-size:25px;color:var(--navy)}.v4-kpi span{font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted)}
.v4-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.v4-acct{background:#fff;border:1px solid var(--line);border-left:7px solid #8b5cf6;border-radius:14px;padding:13px;text-align:left;box-shadow:0 2px 7px rgba(32,41,56,.06)}
.v4-acct.gold{border-left-color:#d4a72c}.v4-acct.silver{border-left-color:#9ca3af}.v4-acct.bronze{border-left-color:#a16207}.v4-acct.red{box-shadow:inset 0 0 0 2px #b3402a}.v4-acct.orange{box-shadow:inset 0 0 0 2px #e58a18}
.v4-top{display:flex;gap:8px;align-items:center}.v4-name{font-size:15px;font-weight:900;color:var(--navy);flex:1}.v4-state{font-size:10px;font-weight:900;padding:4px 8px;border-radius:7px;background:#dcefDC;color:#225c28}
.v4-state.red{background:#fbdad5;color:#9e2b18}.v4-state.yellow{background:#fff3c4;color:#6e5a13}.v4-state.blue{background:#dfe9f8;color:#24407a}.v4-next{font-size:12px;color:var(--ink);margin-top:9px;font-weight:700}.v4-meta{font-size:10.5px;color:var(--muted);margin-top:4px}.v4-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}.v4-chip{font-size:9px;font-weight:900;padding:3px 7px;border-radius:6px;background:#eef1f6;color:#202938}
.v4-tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:12px}.v4-filter{padding:8px 12px;border-radius:9px;background:#e3e1da;color:var(--muted);font-size:11px;font-weight:900}.v4-filter.on{background:var(--orange);color:#fff}
.v4-profile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.v4-hero{display:flex;gap:10px;align-items:flex-start}.v4-title{font-size:20px;font-weight:900;color:var(--navy)}.v4-section{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.v4-section h3{font-size:12px;text-transform:uppercase;color:var(--navy);margin-bottom:8px}
.v4-program{display:flex;align-items:center;gap:8px;padding:9px;border-radius:10px;background:#fbfaf7;margin-top:6px}.v4-program b{flex:1}.v4-dot{width:11px;height:11px;border-radius:50%;background:#3f7a3f}.v4-dot.yellow{background:#e3b015}.v4-dot.red{background:#b3402a}
.v4-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.v4-check{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid var(--line-lt);font-size:13px;font-weight:700}.v4-check input{width:22px;height:22px;accent-color:var(--orange)}
.v4-score{font-size:32px;font-weight:900;color:var(--orange)}.v4-badge{font-size:10px;font-weight:900;padding:4px 8px;border-radius:7px;background:#eef1f6}
@media(max-width:680px){.v4-kpis{grid-template-columns:repeat(2,1fr)}.v4-grid{grid-template-columns:1fr}.v4-acct{padding:12px}}

fique que no venga lluvia fuerte en las próximas horas.","Ajuste la esparcidora a 5 libras por cada 1,000 pies cuadrados. Revise el ajuste en la bolsa antes de empezar.","Primero haga una vuelta por toda la orilla, luego llene el centro en pasadas rectas, traslapando un poco las huellas.","APAGUE la esparcidora al dar vuelta y al cruzar banquetas, entradas o piedra.","Sople todos los gránulos del concreto, cunetas y drenajes de regreso al césped.","Riegue con media pulgada de agua. El pre-emergente NO SIRVE hasta que se riega — avise si el timer no funciona.","No aire, no escarifique ni remueva la tierra después — rompe la barrera contra maleza.","Apunte en la aplicación las bolsas que realmente usó antes de salir de la propiedad."]},"cat":"FERT","pur":true,"epa":""},"SURGE":{"name":"21-3-5 w/ Surge","unit":"50 lb bag","price":44.33,"kind":"lawn","rate":4.5,"rateUnit":"lbs","unitSize":50,"use":"Lawn fertilizer + post-emergent","steps":{"en":["This one kills weeds that are already up, so the weeds must be actively growing — not burnt or dormant.","Apply when the grass blades are slightly DAMP (early morning dew is perfect). The granules need to stick to the leaf.","Set the spreader to 4.5 lbs per 1,000 sq ft.","Header strip, then straight overlapping passes.","Spreader off on turns and hard surfaces; blow concrete clean.","Do NOT water for 24 to 48 hours after — watering washes the weed killer off the leaf before it works.","Tell the customer to hold their irrigation a day, or shut the timer off yourself and note it.","Do not mow for 2 to 3 days after.","Log the bags used before you leave."],"es":["Este mata la maleza que ya salió, así que la maleza debe estar creciendo — no quemada ni dormida.","Aplique cuando las hojas del pasto estén un poco HÚMEDAS (el rocío de la mañana es perfecto). El gránulo tiene que pegarse a la hoja.","Ajuste la esparcidora a 4.5 libras por cada 1,000 pies cuadrados.","Primero la orilla, luego pasadas rectas traslapadas.","Apague la esparcidora en vueltas y concreto; sople el concreto limpio.","NO riegue por 24 a 48 horas — el agua lava el herbicida de la hoja antes de que trabaje.","Dígale al cliente que detenga el riego un día, o apague el timer usted y apúntelo.","No corte el césped por 2 o 3 días después.","Apunte las bolsas usadas antes de salir."]},"cat":"FERT","pur":true,"epa":""},"PROD":{"name":"24-0-4 w/ Prodiamine","unit":"50 lb bag","price":33.23,"kind":"lawn","rate":4.0,"rateUnit":"lbs","unitSize":50,"use":"Lawn fertilizer + pre-emergent","steps":{"en":["Same spread job as February, but this one goes down in the heat — start early in the morning.","Lawn must be dry. Never spread on wet or stressed, drought-dry grass.","Set the spreader to 4 lbs per 1,000 sq ft.","Header strip around the edges first, then straight overlapping passes through the middle.","Spreader OFF on turns and over all hard surfaces.","Blow all granules off concrete and away from drains.","Water in about 1/2 inch right away — in summer heat, unwatered granules can burn the lawn.","Log the bags used before you leave."],"es":["El mismo trabajo que en febrero, pero este va en el calor — empiece temprano en la mañana.","El césped debe estar seco. Nunca esparza sobre pasto mojado o muy reseco y estresado.","Ajuste la esparcidora a 4 libras por cada 1,000 pies cuadrados.","Primero la orilla, luego pasadas rectas traslapadas por el centro.","APAGUE la esparcidora en las vueltas y sobre todo el concreto.","Sople todos los gránulos del concreto y lejos de los drenajes.","Riegue media pulgada de inmediato — en el calor los gránulos sin agua queman el césped.","Apunte las bolsas usadas antes de salir."]},"cat":"FERT","pur":true,"epa":""},"WINTER":{"name":"22-5-5 w/ Fe","unit":"50 lb bag","price":32.17,"kind":"lawn","rate":4.5,"rateUnit":"lbs","unitSize":50,"use":"Winter lawn fertilizer","steps":{"en":["Winter feed — goes down before the cold so the roots store food. Grass should still be green.","Lawn dry, no rain in the next few hours.","Set the spreader to 4.5 lbs per 1,000 sq ft.","Header strip, then straight overlapping passes.","This one has IRON — iron STAINS concrete rust orange. Keep the spreader closed over every hard surface and blow concrete immediately, before any water hits it.","Water in about 1/2 inch after the concrete is clean.","Log the bags used before you leave."],"es":["Alimento de invierno — va antes del frío para que la raíz guarde comida. El pasto debe estar todavía verde.","Césped seco, sin lluvia en las próximas horas.","Ajuste la esparcidora a 4.5 libras por cada 1,000 pies cuadrados.","Primero la orilla, luego pasadas rectas traslapadas.","Este trae HIERRO — el hierro MANCHA el concreto color óxido. Mantenga la esparcidora cerrada sobre todo el concreto y sople de inmediato, antes de que le caiga agua.","Riegue media pulgada después de limpiar el concreto.","Apunte las bolsas usadas antes de salir."]},"cat":"FERT","pur":false,"epa":""},"SG":{"name":"Supreme Green (liquid)","unit":"2.5 gal jug","price":67.75,"kind":"lawn-liquid","rate":6.0,"rateUnit":"oz","unitSize":320,"use":"Liquid lawn fertilizer","steps":{"en":["Liquid feed — mixes and sprays. Wear gloves and eye protection.","Mix at 6 oz per 1,000 sq ft in the tank or hose-end jar. Shake or agitate before and during.","Spray early morning or evening. Do NOT spray over 90 degrees or in wind — it drifts onto cars and windows.","Walk an even pace, overlap each pass slightly, keep the wand at a steady height.","Watch for skips — liquid stripes show up green in a week.","Rinse the tank and wand out at the shop when you're done.","Log the jugs used before you leave."],"es":["Alimento líquido — se mezcla y se rocía. Use guantes y protección para los ojos.","Mezcle 6 onzas por cada 1,000 pies cuadrados en el tanque o el frasco de manguera. Agite antes y durante.","Rocíe temprano en la mañana o en la tarde. NO rocíe arriba de 90 grados ni con viento — se va a los carros y ventanas.","Camine a paso parejo, traslape cada pasada un poco, mantenga la vara a la misma altura.","Cuidado con los brincos — las rayas del líquido se ven verdes en una semana.","Enjuague el tanque y la vara en el taller cuando termine.","Apunte los galones usados antes de salir."]},"cat":"FERT","pur":false,"epa":""},"CONV":{"name":"Converge 18-3-6 (liquid)","unit":"2.5 gal jug","price":74.88,"kind":"lawn-liquid","rate":8.0,"rateUnit":"oz","unitSize":320,"use":"Liquid lawn fertilizer","steps":{"en":["Liquid feed — same job as Supreme Green, heavier rate. Gloves and eye protection.","Mix at 8 oz per 1,000 sq ft. Agitate before and during the application.","Early morning or evening only. No spraying in wind or over 90 degrees.","Even pace, slight overlap on every pass, wand at a steady height.","Keep spray off sidewalks, cars, and building glass.","Rinse the tank and wand at the shop.","Log the jugs used before you leave."],"es":["Alimento líquido — el mismo trabajo que Supreme Green, con más dosis. Guantes y protección para los ojos.","Mezcle 8 onzas por cada 1,000 pies cuadrados. Agite antes y durante la aplicación.","Solo temprano en la mañana o en la tarde. No rocíe con viento ni arriba de 90 grados.","Paso parejo, traslape cada pasada, vara a la misma altura.","Mantenga el rocío fuera de banquetas, carros y vidrios del edificio.","Enjuague el tanque y la vara en el taller.","Apunte los galones usados antes de salir."]},"cat":"FERT","pur":false,"epa":""},"TEN":{"name":"10-10-10 w/ 10% Fe","unit":"50 lb bag","price":30.49,"kind":"bed","rate":5.0,"rateUnit":"lbs","unitSize":50,"use":"Flower bed / shrub fertilizer","steps":{"en":["Flower bed and shrub food. Pull any big weeds out of the bed first.","Spread by hand or hand spreader at 5 lbs per 1,000 sq ft, evenly across the bed.","Keep granules OFF the leaves and out of the crown of the plant — brush any off that land on foliage.","Stay about 6 inches away from the trunk or stem of each shrub.","Scratch it lightly into the top of the mulch or soil where you can.","Water the bed in well after.","Blow granules off any concrete or pathways.","Log the bags used before you leave."],"es":["Alimento para jardineras y arbustos. Primero saque la maleza grande de la jardinera.","Esparza a mano o con esparcidora de mano, 5 libras por cada 1,000 pies cuadrados, parejo en toda la jardinera.","Mantenga los gránulos FUERA de las hojas y del centro de la planta — sacuda los que caigan en el follaje.","Quédese como 6 pulgadas lejos del tronco o tallo de cada arbusto.","Rástrillelo ligeramente en la capa de mulch o tierra donde se pueda.","Riegue bien la jardinera después.","Sople los gránulos del concreto y las banquetas.","Apunte las bolsas usadas antes de salir."]},"cat":"FERT","pur":false,"epa":""},"TI":{"name":"T/I 2.5G (bed pre-em)","unit":"50 lb bag","price":105.74,"kind":"bed","rate":3.5,"rateUnit":"lbs","unitSize":50,"use":"Flower bed pre-emergent","steps":{"en":["Bed pre-emergent — this stops weed seed from sprouting. It does NOT kill weeds that are already there.","Weed the bed CLEAN first. Anything you leave keeps growing.","Rake or fluff the mulch smooth before you spread.","Spread at 3.5 lbs per 1,000 sq ft, evenly over the whole bed surface.","Keep it off the leaves; stay off any bed where the customer is about to plant seed or new flowers.","Water in about 1/2 inch — it does not activate until watered.","Do NOT disturb the soil after. No cultivating, no digging, no raking — that breaks the barrier.","Log the bags used before you leave."],"es":["Pre-emergente para jardineras — evita que la semilla de maleza brote. NO mata la maleza que ya está.","Primero limpie la jardinera de maleza. Lo que deje va a seguir creciendo.","Rastrille o empareje el mulch antes de esparcir.","Esparza 3.5 libras por cada 1,000 pies cuadrados, parejo en toda la jardinera.","Manténgalo fuera de las hojas; no lo use donde el cliente va a sembrar semilla o flores nuevas.","Riegue media pulgada — no se activa hasta que se riega.","NO mueva la tierra después. No cultive, no escarbe, no rastrille — eso rompe la barrera.","Apunte las bolsas usadas antes de salir."]},"cat":"PRE","pur":true,"epa":""},"APHID":{"name":"Tree aphid systemic (product TBD)","unit":"TBD","price":0.0,"kind":"tree","rate":0,"rateUnit":"","unitSize":0,"use":"Systemic drench — aphids & scale","steps":{"en":["Systemic drench for aphids and scale — the tree drinks it up through the roots. Gloves and eye protection required.","Water the soil around the tree FIRST so the ground is moist and will take the drench.","Rake mulch back from the base to expose bare soil in a ring at the dripline.","Mix per the label for the trunk size — measure the trunk diameter, don't guess.","Pour slowly in a ring around the trunk out toward the dripline so it soaks in instead of running off.","Do NOT let it run onto concrete, into gutters, or anywhere near a storm drain or ditch.","Rake the mulch back over when the soil has taken it.","Never apply while the tree is in bloom — bees.","Note the date and the tree in the app; this holds for the season."],"es":["Aplicación al suelo para pulgón y escama — el árbol lo toma por la raíz. Se requieren guantes y protección para los ojos.","PRIMERO riegue la tierra alrededor del árbol para que esté húmeda y acepte el producto.","Retire el mulch de la base para dejar tierra descubierta en un círculo hasta la orilla de la copa.","Mezcle según la etiqueta para el grueso del tronco — mida el diámetro, no adivine.","Vierta despacio en círculo alrededor del tronco hacia la orilla de la copa para que se absorba y no escurra.","NO deje que escurra al concreto, a las cunetas, ni cerca de un drenaje o zanja.","Vuelva a poner el mulch cuando la tierra lo haya absorbido.","Nunca aplique cuando el árbol está en flor — por las abejas.","Apunte la fecha y el árbol en la aplicación; esto dura toda la temporada."]},"cat":"TREE","pur":true,"epa":""},"DEEP":{"name":"Tree deep-root feed (product TBD)","unit":"TBD","price":0.0,"kind":"tree","rate":0,"rateUnit":"","unitSize":0,"use":"Deep-root tree fertilization","steps":{"en":["Deep-root feeding — food goes below the grass roots where the tree feeds.","Water the area first if the soil is hard and dry.","Work in a grid around the tree from about 3 feet off the trunk out to the dripline — that's where the feeder roots are, not at the trunk.","Inject or drench 8 to 12 inches deep, spacing the holes about 2 to 3 feet apart.","Keep the pressure steady so it doesn't blow out and geyser to the surface.","Water the whole area in when you finish.","Note the date and the tree in the app."],"es":["Alimentación de raíz profunda — la comida va debajo de la raíz del pasto donde come el árbol.","Riegue el área primero si la tierra está dura y seca.","Trabaje en cuadrícula alrededor del árbol, desde como 3 pies del tronco hasta la orilla de la copa — ahí están las raíces que comen, no en el tronco.","Inyecte o aplique de 8 a 12 pulgadas de profundidad, con hoyos cada 2 o 3 pies.","Mantenga la presión pareja para que no reviente y salga a la superficie.","Riegue toda el área al terminar.","Apunte la fecha y el árbol en la aplicación."]},"cat":"TREE","pur":false,"epa":""},"PRE007":{"name":"0-0-7 w/ Prodiamine (pre-emergent only)","unit":"50 lb bag","price":0,"kind":"lawn","cat":"PRE","rate":3.0,"rateUnit":"lbs","unitSize":50,"use":"Straight weed prevention — stops seed from sprouting, no fertilizer","steps":{"en":["This is weed PREVENTION only — no fertilizer in it. It stops seed from sprouting; it will not kill weeds already up.","Lawn dry, spreader set to 3 lbs per 1,000 sq ft.","Header strip around the edges, then straight overlapping passes.","Spreader OFF on turns and hard surfaces; blow all granules back onto the grass.","Water in about 1/2 inch — it does nothing until watered in.","Do not aerate or dethatch after — that breaks the barrier.","Log the bags used before you leave."],"es":["Esto es solo PREVENCIÓN de maleza — no trae fertilizante. Evita que la semilla brote; no mata la maleza que ya salió.","Césped seco, esparcidora a 3 libras por cada 1,000 pies cuadrados.","Primero la orilla, luego pasadas rectas traslapadas.","APAGUE la esparcidora en vueltas y concreto; sople todos los gránulos al pasto.","Riegue media pulgada — no sirve hasta que se riega.","No aire ni escarifique después — rompe la barrera.","Apunte las bolsas usadas antes de salir."]},"pur":true,"epa":""},"SPEED":{"name":"SpeedZone (post-emergent weed killer)","unit":"1 gal jug","price":0,"kind":"lawn-liquid","cat":"POST","rate":1.5,"rateUnit":"oz","unitSize":128,"use":"Kills broadleaf weeds growing in the grass — spurge, clover, dandelion","steps":{"en":["This KILLS weeds already growing in the lawn. Gloves, eye protection, long sleeves.","Mix at 1.5 oz per 1,000 sq ft in the tank. Agitate well.","Spray when weeds are actively growing, temps under 85, and NO wind — this product drifts and will hurt flowers and shrubs.","Spot-spray the weeds or blanket the weedy areas — light, even coat on the leaf. Don't soak it to runoff.","Keep it OFF flower beds, shrubs, and tree suckers. If it's windy, do not spray — come back.","Do not water or mow for 24 hours after.","Rinse the tank with three rinses at the shop — never dump rinse water in a drain.","Log the amount used before you leave."],"es":["Esto MATA la maleza que ya está creciendo en el césped. Guantes, protección de ojos, manga larga.","Mezcle 1.5 onzas por cada 1,000 pies cuadrados en el tanque. Agite bien.","Rocíe cuando la maleza está creciendo, con menos de 85 grados y SIN viento — este producto se desvía y daña flores y arbustos.","Rocíe las manchas de maleza o cubra las áreas con maleza — capa ligera y pareja en la hoja. No empape hasta que escurra.","Manténgalo FUERA de jardineras, arbustos y retoños de árbol. Si hay viento, no rocíe — regrese otro día.","No riegue ni corte por 24 horas después.","Enjuague el tanque tres veces en el taller — nunca tire el agua de enjuague en un drenaje.","Apunte la cantidad usada antes de salir."]},"pur":true,"epa":""},"FUNGG":{"name":"Headway G Fungicide","unit":"30 lb bag","price":0,"kind":"lawn","cat":"FUNG","rate":2.5,"rateUnit":"lbs","unitSize":30,"use":"Granular fungicide — brown patch, summer patch, dollar spot","steps":{"en":["Fungicide for lawn disease — brown circles, thin patches that aren't dry spots. Confirm with Michael before treating.","Gloves and eye protection. Lawn can be lightly damp.","Set the spreader to 2.5 lbs per 1,000 sq ft.","Cover the sick area PLUS a 5 to 10 foot ring of healthy grass around it — the fungus is bigger than what you can see.","Spreader off on hard surfaces; blow concrete clean.","Water in lightly (about 1/4 inch) unless the label says otherwise.","Do not mow until the granules are watered in.","Log the bags used and WHICH property had the fungus — Michael tracks it."],"es":["Fungicida para enfermedad del césped — círculos cafés, áreas ralas que no son secas. Confirme con Michael antes de tratar.","Guantes y protección de ojos. El césped puede estar un poco húmedo.","Ajuste la esparcidora a 2.5 libras por cada 1,000 pies cuadrados.","Cubra el área enferma MÁS un anillo de 5 a 10 pies de pasto sano alrededor — el hongo es más grande de lo que se ve.","Esparcidora apagada en concreto; sople el concreto limpio.","Riegue ligero (como 1/4 de pulgada) a menos que la etiqueta diga otra cosa.","No corte hasta que los gránulos se hayan regado.","Apunte las bolsas usadas y CUÁL propiedad tenía el hongo — Michael lo registra."]},"pur":true,"epa":""},"IRON":{"name":"Liquid Iron (chelated Fe)","unit":"2.5 gal jug","price":0,"kind":"lawn-liquid","cat":"GREEN","rate":6.0,"rateUnit":"oz","unitSize":320,"use":"Quick green-up in days without pushing growth — safe in heat","steps":{"en":["Quick green — color in 2 to 4 days without pushing growth, safe even in summer heat.","Gloves and eye protection. Mix at 6 oz per 1,000 sq ft.","Spray early morning. Even pace, slight overlap, steady wand height.","IRON STAINS — keep it off concrete, stucco, fences and cars. If any lands on concrete, rinse IMMEDIATELY before it dries.","Don't spray right before rain or irrigation — give it a few hours on the leaf.","Rinse the tank at the shop.","Log the amount used before you leave."],"es":["Verde rápido — color en 2 a 4 días sin empujar crecimiento, seguro hasta en el calor del verano.","Guantes y protección de ojos. Mezcle 6 onzas por cada 1,000 pies cuadrados.","Rocíe temprano en la mañana. Paso parejo, traslape ligero, vara a altura fija.","EL HIERRO MANCHA — manténgalo fuera de concreto, estuco, cercas y carros. Si cae en concreto, enjuague DE INMEDIATO antes de que seque.","No rocíe justo antes de lluvia o riego — déjelo unas horas en la hoja.","Enjuague el tanque en el taller.","Apunte la cantidad usada antes de salir."]},"pur":false,"epa":""},"AMS":{"name":"Ammonium Sulfate 21-0-0","unit":"50 lb bag","price":0,"kind":"lawn","cat":"GREEN","rate":3.0,"rateUnit":"lbs","unitSize":50,"use":"Fast nitrogen green-up — cheap, quick color and growth","steps":{"en":["Fast nitrogen — greens quick but PUSHES GROWTH, so the mow gets heavier. Not for heat-stressed lawns.","Lawn must be DRY — this will burn wet grass. Never over 3 lbs per 1,000 sq ft.","Header strip, then straight overlapping passes. No skips — stripes show hard with this one.","Spreader off on turns and concrete; blow hard surfaces clean.","WATER IN THE SAME DAY, 1/2 inch minimum — unwatered ammonium sulfate burns the lawn.","Skip this product entirely if temps are over 95 or the lawn can't be watered.","Log the bags used before you leave."],"es":["Nitrógeno rápido — enverdece pronto pero EMPUJA CRECIMIENTO, así que el corte se pone más pesado. No para césped estresado por calor.","El césped debe estar SECO — quema el pasto mojado. Nunca más de 3 libras por 1,000 pies cuadrados.","Primero la orilla, luego pasadas rectas traslapadas. Sin brincos — con este las rayas se notan mucho.","Esparcidora apagada en vueltas y concreto; sople el concreto limpio.","RIEGUE EL MISMO DÍA, mínimo media pulgada — el sulfato de amonio sin regar quema el césped.","No use este producto si hay más de 95 grados o si no se puede regar.","Apunte las bolsas usadas antes de salir."]},"pur":false,"epa":""},"HYDRE":{"name":"Hydretain Granular (moisture manager)","unit":"40 lb bag","price":0,"kind":"lawn","cat":"WET","rate":2.7,"rateUnit":"lbs","unitSize":40,"use":"Dry-spot rescue — pulls soil moisture vapor back to the roots, lasts up to 3 months","steps":{"en":["For dry spots and drought-stressed lawns — it grabs moisture vapor in the soil and turns it back into water the roots can drink. One application holds up to 3 months.","Spread at 2.7 lbs per 1,000 sq ft with any spreader — whole lawn, or just the dry areas plus a wide ring around them.","Safe around kids and pets; no re-entry wait.","Water in with about 1/4 to 1/2 inch right after — it has to reach the root zone to work.","It is NOT a fix for a broken sprinkler — if a zone is dead, tell Michael. This buys time; it doesn't replace water.","Also works in flower beds and around trees on the same rate.","Log the bags used and which properties got it."],"es":["Para áreas secas y césped estresado por sequía — agarra el vapor de humedad de la tierra y lo vuelve agua que la raíz puede tomar. Una aplicación dura hasta 3 meses.","Esparza 2.7 libras por cada 1,000 pies cuadrados con cualquier esparcidora — todo el césped, o solo las áreas secas más un anillo ancho alrededor.","Seguro con niños y mascotas; no hay que esperar para entrar.","Riegue de 1/4 a 1/2 pulgada de inmediato — tiene que llegar a la raíz para trabajar.","NO arregla un aspersor descompuesto — si una zona está muerta, dígale a Michael. Esto da tiempo; no reemplaza el agua.","También sirve en jardineras y alrededor de árboles con la misma dosis.","Apunte las bolsas usadas y cuáles propiedades lo recibieron."]},"pur":false,"epa":""},"TF90":{"name":"Tall Fescue Blend 90/10 (w/ bluegrass)","unit":"50 lb bag","price":0,"kind":"lawn","cat":"SEED","rate":5.0,"rateUnit":"lbs","unitSize":50,"use":"THE Central Valley lawn seed — overseed 4–5 lbs/1,000, new lawn 8–10 lbs/1,000","steps":{"en":["Best overseed window in the Valley: mid-September to October, or March to April. Skip July heat.","Mow the lawn SHORT (about 1.5 inches) and bag the clippings first.","Aerate or rough up the soil — seed must touch DIRT, not sit on thatch.","Spread 4 to 5 lbs per 1,000 sq ft for overseed (8 to 10 for bare/new areas).","Rake or drag lightly so seed settles into the holes and grooves.","Water LIGHT and OFTEN — 2 to 3 short waterings a day for 2 weeks. The seed bed can never dry out.","Tell the customer: stay off it 3 weeks, first mow when it hits 3 inches.","No pre-emergent for 8 weeks before or after seeding — it stops the grass seed too.","Log the bags used before you leave."],"es":["Mejor tiempo en el Valle: mediados de septiembre a octubre, o marzo a abril. No en el calor de julio.","Corte el césped BAJITO (como 1.5 pulgadas) y recoja los recortes primero.","Airee o rasque la tierra — la semilla debe tocar TIERRA, no quedarse sobre el thatch.","Esparza 4 a 5 libras por 1,000 pies cuadrados para resembrar (8 a 10 en áreas peladas o nuevas).","Rastrille ligero para que la semilla entre en los hoyos y surcos.","Riegue POCO y SEGUIDO — 2 a 3 riegos cortos al día por 2 semanas. La cama de semilla nunca debe secarse.","Dígale al cliente: no pisar por 3 semanas, primer corte cuando llegue a 3 pulgadas.","Sin pre-emergente 8 semanas antes o después de sembrar — también detiene la semilla de pasto.","Apunte las bolsas usadas antes de salir."]},"pur":false,"epa":""},"DWARF":{"name":"Dwarf Tall Fescue","unit":"50 lb bag","price":0,"kind":"lawn","cat":"SEED","rate":5.0,"rateUnit":"lbs","unitSize":50,"use":"Slower-growing fescue — less mowing, same Valley toughness. Overseed 4–5, new 8–10 lbs/1,000","steps":{"en":["Same job as the 90/10 blend — this one just grows slower and mows less.","Mow short, bag clippings, aerate or scratch the soil.","4 to 5 lbs per 1,000 overseed; 8 to 10 new.","Rake in, then water light 2 to 3 times a day for 2 weeks.","No pre-emergent 8 weeks either side of seeding.","Log the bags used."],"es":["El mismo trabajo que la mezcla 90/10 — solo que crece más lento y se corta menos.","Corte bajito, recoja recortes, airee o rasque la tierra.","4 a 5 libras por 1,000 para resembrar; 8 a 10 nuevo.","Rastrille y riegue poco 2 a 3 veces al día por 2 semanas.","Sin pre-emergente 8 semanas antes o después.","Apunte las bolsas usadas."]},"pur":false,"epa":""},"RYE":{"name":"Perennial Ryegrass (winter overseed)","unit":"50 lb bag","price":0,"kind":"lawn","cat":"SEED","rate":9.0,"rateUnit":"lbs","unitSize":50,"use":"Winter color on bermuda — overseed 8–10 lbs/1,000 in October when nights cool","steps":{"en":["This keeps bermuda lawns green through winter. Overseed in October when nights drop below 65.","Scalp the bermuda down LOW and bag everything — the rye needs light and soil contact.","Spread 8 to 10 lbs per 1,000 sq ft, two directions for even cover.","Drag or rake lightly, then water light 2 to 3 times a day until it's up (5 to 10 days).","First mow at 2 inches. It dies out naturally when summer heat brings the bermuda back.","Log the bags used."],"es":["Esto mantiene el césped bermuda verde en invierno. Resiembre en octubre cuando las noches bajen de 65.","Corte la bermuda BIEN BAJO y recoja todo — el rye necesita luz y contacto con la tierra.","Esparza 8 a 10 libras por 1,000 pies cuadrados, en dos direcciones para cobertura pareja.","Rastrille ligero y riegue poco 2 a 3 veces al día hasta que salga (5 a 10 días).","Primer corte a 2 pulgadas. Se muere solo cuando el calor del verano regresa la bermuda.","Apunte las bolsas usadas."]},"pur":false,"epa":""},"BERM":{"name":"Bermuda (hulled)","unit":"25 lb bag","price":0,"kind":"lawn","cat":"SEED","rate":1.5,"rateUnit":"lbs","unitSize":25,"use":"Full-sun tough turf — seed 1–2 lbs/1,000 in late spring, soil 65°+ only","steps":{"en":["Bermuda only germinates in WARM soil — late April through June. Never fall.","Full sun areas only; bermuda thins out in shade.","Seed 1 to 2 lbs per 1,000 on prepared bare soil, rake in SHALLOW (1/4 inch max).","Keep the surface moist with light waterings until it's up (10 to 21 days).","Warn the customer: bermuda spreads into flower beds — edge it hard.","Log the bags used."],"es":["La bermuda solo germina en tierra CALIENTE — fines de abril a junio. Nunca en otoño.","Solo áreas de pleno sol; la bermuda se hace rala en la sombra.","Siembre 1 a 2 libras por 1,000 en tierra preparada, rastrille POCO PROFUNDO (máximo 1/4 de pulgada).","Mantenga la superficie húmeda con riegos ligeros hasta que salga (10 a 21 días).","Avísele al cliente: la bermuda se mete a las jardineras — mantenga la orilla firme.","Apunte las bolsas usadas."]},"pur":false,"epa":""},"GLYPro":{"name":"Glyphosate Pro 41% (Roundup Pro generic)","unit":"2.5 gal jug","price":0,"kind":"lawn-liquid","cat":"KNOCK","rate":2.0,"rateUnit":"oz","unitSize":320,"pur":true,"epa":"","use":"The workhorse knockdown — kills EVERYTHING green it touches. Fence lines, cracks, bed prep, lot knockdown","steps":{"en":["NON-SELECTIVE — it kills grass, flowers, shrubs, everything green it touches. This is not a lawn spray.","Gloves, eye protection, long sleeves. Mix per label — about 2 oz per gallon for general knockdown.","Dead calm or light morning air ONLY. Drift onto a customer's lawn or roses is a claim.","Coarse spray, low pressure, nozzle low. Spray to wet — not dripping.","Rain-fast in about 2 hours; needs actively green weeds. Skip dust-covered or drought-shut plants.","Yellowing shows in 5–10 days. Don't respray at day 3 — wait 2 weeks before a second pass.","Never spray suckers at a tree base with it — it moves into the tree. Cut suckers instead.","Triple-rinse the tank at the shop. Log it — this is a county-reportable product."],"es":["NO SELECTIVO — mata pasto, flores, arbustos, todo lo verde que toca. No es para el césped.","Guantes, protección de ojos, manga larga. Mezcle según la etiqueta — como 2 onzas por galón.","SOLO con el aire quieto o brisa ligera de mañana. Si se desvía al césped o rosas del cliente, es un reclamo.","Rocío grueso, presión baja, boquilla abajo. Moje la hoja — sin escurrir.","Resiste lluvia en 2 horas; necesita maleza verde y activa. No sirve en plantas polvosas o cerradas por sequía.","Se pone amarillo en 5–10 días. No repita al día 3 — espere 2 semanas para segunda pasada.","Nunca rocíe los retoños al pie de un árbol — se mueve al árbol. Córtelos.","Enjuague el tanque tres veces en el taller. Apúntelo — este producto se reporta al condado."]}},"CHEET":{"name":"Cheetah Pro (glufosinate)","unit":"2.5 gal jug","price":0,"kind":"lawn-liquid","cat":"KNOCK","rate":4.0,"rateUnit":"oz","unitSize":320,"pur":true,"epa":"","use":"Faster burndown than glyphosate, works on glyphosate-resistant fleabane/ryegrass — rotate with it"},"DIQ":{"name":"Diquat (Reward)","unit":"1 gal jug","price":0,"kind":"lawn-liquid","cat":"KNOCK","rate":1.0,"rateUnit":"oz","unitSize":128,"pur":true,"epa":"","use":"Same-day visible burndown — customer-complaint cracks and edges when it has to look done TODAY"},"SEDGE":{"name":"SedgeHammer (halosulfuron)","unit":"13.5 g packet","price":0,"kind":"lawn-liquid","cat":"POST","rate":0.9,"rateUnit":"oz","unitSize":13.5,"pur":true,"epa":"","use":"THE nutsedge killer — safe over fescue and bermuda. Regular weed killer does nothing to sedge","steps":{"en":["This is the sedge specialist — one packet treats about 1,000 sq ft of nutsedge area.","Mix with a nonionic surfactant per label or it won't stick to the waxy sedge leaf.","Spray actively growing sedge — it yellows slow, 2 to 4 WEEKS. Tell the customer it's working before it looks like it.","Safe over the lawn itself — fescue and bermuda tolerate it.","Don't mow 2 days before or after.","Sedge means WATER — find and fix the wet spot or it's back next year.","Log it — county-reportable."],"es":["Este es el especialista en coquillo — un paquete trata como 1,000 pies cuadrados.","Mezcle con surfactante según la etiqueta o no se pega a la hoja cerosa del coquillo.","Rocíe coquillo en crecimiento — amarilla lento, 2 a 4 SEMANAS. Dígale al cliente que está trabajando aunque no se vea.","Seguro sobre el césped — fescue y bermuda lo toleran.","No corte 2 días antes ni después.","Coquillo significa AGUA — encuentre y arregle el punto mojado o regresa el próximo año.","Apúntelo — se reporta al condado."]}},"TURFL":{"name":"Turflon Ester (triclopyr)","unit":"1 gal jug","price":0,"kind":"lawn-liquid","cat":"POST","rate":0.75,"rateUnit":"oz","unitSize":128,"pur":true,"epa":"","use":"Bermuda & kikuyu suppression in fescue lawns — the Valley's invasion fighter. Also hard broadleaf (oxalis)","steps":{"en":["The fescue defender — suppresses bermuda and kikuyu creeping into tall fescue lawns.","Suppression program: repeat apps roughly monthly May–September per label. One shot does nothing.","COOL applications only — under 85°F or it hurts the fescue too. Early morning in summer.","Also the strong option on oxalis and wild violet where SpeedZone struggles.","NEVER on a bermuda lawn the customer wants to keep — it's the point of the product.","Vapor moves in heat — keep away from tomatoes, grapes, roses on hot days.","Log it — county-reportable."],"es":["El defensor del fescue — suprime la bermuda y kikuyu que invaden céspedes de fescue.","Programa de supresión: aplicaciones repetidas más o menos cada mes de mayo a septiembre según etiqueta. Una sola no hace nada.","Solo aplicaciones FRESCAS — menos de 85°F o daña también el fescue. Temprano en verano.","También la opción fuerte para oxalis y violeta donde SpeedZone batalla.","NUNCA en un césped de bermuda que el cliente quiere conservar — para eso es el producto.","El vapor se mueve con calor — lejos de tomates, uvas y rosas en días calientes.","Apúntelo — se reporta al condado."]}},"DRIVE":{"name":"Drive XLR8 (quinclorac)","unit":"0.5 gal jug","price":0,"kind":"lawn-liquid","cat":"POST","rate":0.37,"rateUnit":"oz","unitSize":64,"pur":true,"epa":"","use":"Post-emergent CRABGRASS killer — for the ones that got past the pre-emergent. Plus clover","steps":{"en":["For crabgrass already UP — the escapes the February pre-emergent missed.","Mix with methylated seed oil (MSO) per label — it needs the oil to work.","Best on young crabgrass (2–4 leaf) or mature; mid-size tillering plants resist it — spray early when you first see it.","Safe on fescue and bermuda. Do NOT reseed for 2–4 weeks either side per label.","Rain-fast fast; don't water for 24 hours anyway.","Log it — county-reportable."],"es":["Para crabgrass que ya SALIÓ — los escapes que el pre-emergente de febrero no agarró.","Mezcle con aceite MSO según la etiqueta — necesita el aceite para trabajar.","Mejor en crabgrass joven (2–4 hojas) o maduro; el mediano resiste — rocíe temprano en cuanto lo vea.","Seguro en fescue y bermuda. NO resiembre 2–4 semanas antes o después según etiqueta.","Resiste lluvia rápido; aun así no riegue por 24 horas.","Apúntelo — se reporta al condado."]}},"GALL":{"name":"Gallery SC (isoxaben)","unit":"0.5 gal jug","price":0,"kind":"bed","cat":"PRE","rate":0.31,"rateUnit":"oz","unitSize":64,"pur":true,"epa":"","use":"Bed pre-emergent for BROADLEAF weeds — pairs with Surflan/T-I for full-spectrum bed prevention"},"SURF":{"name":"Surflan AS (oryzalin)","unit":"2.5 gal jug","price":0,"kind":"bed","cat":"PRE","rate":1.5,"rateUnit":"oz","unitSize":320,"pur":true,"epa":"","use":"Liquid bed pre-emergent for grassy weeds — the orange spray. Stains hardscape, watch overspray"},"PEND":{"name":"Pendulum 2G (pendimethalin)","unit":"40 lb bag","price":0,"kind":"bed","cat":"PRE","rate":2.3,"rateUnit":"lbs","unitSize":40,"pur":true,"epa":"","use":"Granular bed/shrub pre-emergent alternative — rotate chemistry with T/I year to year"},"TGPLUS":{"name":"TurfGro PLUS Complete Soil Ca
